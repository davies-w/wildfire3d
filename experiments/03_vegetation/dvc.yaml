# Experiment 03: vegetation as distinct burning objects.
#
# Two decks, one stage each, so each stage owns exactly its own case's output.
# `dvc repro` runs this file; `dvc.lock` is committed.  Outputs are tracked
# where FDS writes them; the .s3d volumes are uncached, so DVC knows this stage
# produces them without ever copying or pushing them.
stages:
  solve_veg:
    wdir: ../..
    cmd: >-
      python3 scripts/run_fds.py experiments/03_vegetation/garden_veg.fds --threads 4
      && python3 scripts/strip_terrain.py FDS/cases/garden_veg garden_veg
    deps:
      - experiments/03_vegetation/garden_veg.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - FDS/cases/garden_veg/garden_veg_1.prt5
      - FDS/cases/garden_veg/garden_veg_1_1.bf
      - FDS/cases/garden_veg/garden_veg_1_2.bf
      - FDS/cases/garden_veg/garden_veg_1_1.sf
      - FDS/cases/garden_veg/garden_veg_1_2.sf
      - FDS/cases/garden_veg/garden_veg.smv
      - FDS/cases/garden_veg/garden_veg_1_1.s3d:
          cache: false
      - FDS/cases/garden_veg/garden_veg_1_3.s3d:
          cache: false

  solve_veg_obst:
    wdir: ../..
    cmd: >-
      python3 scripts/run_fds.py experiments/03_vegetation/garden_veg_obst.fds --threads 4
      && python3 scripts/strip_terrain.py FDS/cases/garden_veg_obst garden_veg_obst
    deps:
      - experiments/03_vegetation/garden_veg_obst.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - FDS/cases/garden_veg_obst/garden_veg_obst_1.prt5
      - FDS/cases/garden_veg_obst/garden_veg_obst_1_1.bf
      - FDS/cases/garden_veg_obst/garden_veg_obst_1_2.bf
      - FDS/cases/garden_veg_obst/garden_veg_obst_1_1.sf
      - FDS/cases/garden_veg_obst/garden_veg_obst_1_2.sf
      - FDS/cases/garden_veg_obst/garden_veg_obst.smv
      - FDS/cases/garden_veg_obst/garden_veg_obst_1_1.s3d:
          cache: false
      - FDS/cases/garden_veg_obst/garden_veg_obst_1_3.s3d:
          cache: false
