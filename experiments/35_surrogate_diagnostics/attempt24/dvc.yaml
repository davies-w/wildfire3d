stages:
  prepare_data:
    cmd: ../../../.venv/bin/python prepare.py
    deps:
    - prepare.py
    - ../attempt20/data/sequences.npz
    - ../attempt20/schema.json
    - ../attempt22/data/activity_audit/labels.npz
    - ../scorecard-v1.json
    outs:
    - data/sequences.npz
    - schema.json:
        cache: false
  package:
    cmd: ../../../.venv/bin/python validate.py && ../../../.venv/bin/python validate_gates.py
      && ../../../.venv/bin/python validate_transport.py && ../../../.venv/bin/python
      validate_evaluation.py && ../../../.venv/bin/python prepare_pilot.py
    deps:
    - ../../32_tree_expansion/gpu-workflow.yaml
    - analyze.py
    - archive_upload.py
    - cloud.py
    - collect.py
    - coverage-plan.json
    - data/sequences.npz
    - finalize_archive.py
    - finish_run.py
    - launch.py
    - model.py
    - prepare.py
    - prepare_pilot.py
    - runtime.py
    - schema.json
    - validate.py
    - validate_gates.py
    - validate_transport.py
    - worker.py
    - validate_evaluation.py
    outs:
    - data/pilot-overlay.tar
    - gpu-workflow.yaml:
        cache: false
    - results/input-freeze.json:
        cache: false
    - results/preflight.json:
        cache: false
    metrics:
    - results/transport-preflight.json:
        cache: false
    - results/gate-preflight.json:
        cache: false
    - results/evaluation-preflight.json:
        cache: false
  cloud_submit:
    cmd: ../../../.venv/bin/python launch.py
    deps:
    - launch.py
    - cloud.py
    - gpu-workflow.yaml
    - data/pilot-overlay.tar
    - ../../../scripts/reconcile_runtime_costs.py
    metrics:
    - results/execution.json:
        cache: false
  cloud_collect:
    cmd: ../../../.venv/bin/python collect.py
    deps:
    - collect.py
    - cloud.py
    - results/execution.json
    outs:
    - data/collected
    metrics:
    - results/cleanup.json:
        cache: false
    - results/permission-removed.json:
        cache: false
  analysis:
    cmd: ../../../.venv/bin/python analyze.py
    deps:
    - analyze.py
    - schema.json
    - data/collected
    outs:
    - data/visuals
    metrics:
    - results/analysis.json:
        cache: false
  scorecard:
    cmd: ../../../.venv/bin/python scorecard_summary.py && ../../../.venv/bin/python
      audit_scorecard.py && ../../../.venv/bin/python render_scorecard.py
    deps:
    - scorecard_summary.py
    - audit_scorecard.py
    - render_scorecard.py
    - data/sequences.npz
    - data/collected
    - ../scorecard-v1.json
    outs:
    - data/scorecard
    metrics:
    - results/scorecard-summary.json:
        cache: false
    - results/scenario-audit.json:
        cache: false
  scenario_values:
    cmd: ../../../.venv/bin/python plot_scenario_values.py
    deps:
    - plot_scenario_values.py
    - schema.json
    - data/sequences.npz
    - data/collected/fold01-horizon01-predictions.npz
    - data/collected/fold01-horizon16-predictions.npz
    - scenario_chart.html
    - data/scenario_horizons
    outs:
    - data/scenario_values
  scenario_horizons:
    cmd: ../../../.venv/bin/python predict_scenario_horizons.py
    deps:
    - predict_scenario_horizons.py
    - model.py
    - schema.json
    - data/sequences.npz
    - data/collected/fold01-selected.pt
    - data/collected/fold01-horizon01-predictions.npz
    - data/collected/fold01-horizon04-predictions.npz
    - data/collected/fold01-horizon08-predictions.npz
    - data/collected/fold01-horizon16-predictions.npz
    outs:
    - data/scenario_horizons
  scenario_gallery:
    cmd: ../../../.venv/bin/python build_gallery.py && node validate_gallery.cjs
    deps:
    - build_gallery.py
    - gallery.html
    - validate_gallery.cjs
    - model.py
    - schema.json
    - data/sequences.npz
    - data/collected
    outs:
    - data/scenario_gallery
