stages:
  prepare_data:
    cmd: ../../../.venv/bin/python prepare.py
    deps:
    - prepare.py
    - coverage-plan.json
    - ../attempt24/data/sequences.npz
    - ../attempt24/schema.json
    - ../scorecard-v1.json
    outs:
    - data/sequences.npz
    - schema.json:
        cache: false
  package:
    cmd: ../../../.venv/bin/python validate.py && ../../../.venv/bin/python validate_transport.py
      && ../../../.venv/bin/python validate_evaluation.py && ../../../.venv/bin/python
      prepare_pilot.py
    deps:
    - ../../32_tree_expansion/gpu-workflow.yaml
    - cloud.py
    - collect.py
    - coverage-plan.json
    - data/sequences.npz
    - launch.py
    - model.py
    - prepare.py
    - prepare_pilot.py
    - runtime.py
    - schema.json
    - validate.py
    - validate_transport.py
    - worker.py
    - validate_evaluation.py
    outs:
    - data/pilot-overlay.tar
    - gpu-workflow.yaml:
        cache: false
    - results/input-freeze.json:
        cache: false
    - results/preflight.json:
        cache: false
    metrics:
    - results/transport-preflight.json:
        cache: false
    - results/evaluation-preflight.json:
        cache: false
  cloud_submit:
    cmd: ../../../.venv/bin/python launch.py
    deps:
    - launch.py
    - cloud.py
    - gpu-workflow.yaml
    - data/pilot-overlay.tar
    - ../../../scripts/reconcile_runtime_costs.py
    metrics:
    - results/execution.json:
        cache: false
  cloud_collect:
    cmd: ../../../.venv/bin/python collect.py
    deps:
    - collect.py
    - cloud.py
    - results/execution.json
    outs:
    - data/collected
    metrics:
    - results/cleanup.json:
        cache: false
    - results/permission-removed.json:
        cache: false
  analysis:
    cmd: ../../../.venv/bin/python analyze_learning_curve.py
    deps:
    - analyze_learning_curve.py
    - schema.json
    - data/collected
    - ../scorecard-v1.json
    outs:
    - data/learning_curve
    metrics:
    - results/learning-curve.json:
        cache: false
  audit:
    cmd: ../../../.venv/bin/python audit_scorecard.py
    deps:
    - audit_scorecard.py
    - schema.json
    - data/sequences.npz
    - data/collected
    - ../scorecard-v1.json
    metrics:
    - results/scenario-audit.json:
        cache: false
