stages:
  prepare_data:
    cmd: ../../../.venv/bin/python prepare_data.py
    deps:
    - prepare_data.py
    - ../attempt12/data/states
    - ../attempt12/inventory.json
    - ../attempt12/results/validation.json
    outs:
    - data/sequences.npz
    - schema.json:
        cache: false
    metrics:
    - results/data-verification.json:
        cache: false
  package:
    cmd: ../../../.venv/bin/python validate.py && ../../../.venv/bin/python prepare_pilot.py
    deps:
    - validate.py
    - prepare_pilot.py
    - worker.py
    - model.py
    - runtime.py
    - launch.py
    - collect.py
    - cloud.py
    - coverage-plan.json
    - schema.json
    - data/sequences.npz
    - ../../32_tree_expansion/gpu-workflow.yaml
    outs:
    - data/pilot-overlay.tar
    - gpu-workflow.yaml:
        cache: false
    - results/input-freeze.json:
        cache: false
    - results/preflight.json:
        cache: false
  cloud_submit:
    cmd: ../../../.venv/bin/python launch.py
    deps:
    - launch.py
    - cloud.py
    - gpu-workflow.yaml
    - data/pilot-overlay.tar
    metrics:
    - results/execution.json:
        cache: false
  cloud_collect:
    cmd: ../../../.venv/bin/python collect.py
    deps:
    - collect.py
    - cloud.py
    - results/execution.json
    outs:
    - data/collected
    metrics:
    - results/cleanup.json:
        cache: false
    - results/permission-removed.json:
        cache: false
  analysis:
    cmd: ../../../.venv/bin/python analyze.py
    deps:
    - analyze.py
    - schema.json
    - data/collected
    outs:
    - data/visuals
    metrics:
    - results/analysis.json:
        cache: false
