stages:
  prepare_labels:
    cmd: ../../../.venv/bin/python prepare_labels.py
    deps:
    - prepare_labels.py
    - fields.py
    - fortran_records.py
    - cases.json
    - coverage-plan.json
    - ../../33_representation_loss/attempt14/data/geometries.npz
    - ../../33_representation_loss/attempt14/results/input-freeze.json
    - ../../32_tree_expansion/data/cloud_archive
    outs:
    - data/labels
    - data/geometries.npz
    - data/class-population.json
    metrics:
    - results/labels-audit.json:
        cache: false
  validate:
    cmd: ../../../.venv/bin/python validate.py
    deps:
    - validate.py
    - model.py
    - data/labels
    - coverage-plan.json
    - results/labels-audit.json
    metrics:
    - results/preflight.json:
        cache: false
  package:
    cmd: ../../../.venv/bin/python prepare_pilot.py
    deps:
    - worker.py
    - model.py
    - prepare_pilot.py
    - launch.py
    - collect.py
    - runtime.py
    - cloud.py
    - data/labels
    - data/geometries.npz
    - data/class-population.json
    - cases.json
    - coverage-plan.json
    - results/preflight.json
    outs:
    - data/pilot-overlay.tar
    - gpu-workflow.yaml:
        cache: false
    metrics:
    - results/prepared.json:
        cache: false
    - results/input-freeze.json:
        cache: false
  cloud_submit:
    cmd: ../../../.venv/bin/python launch.py
    deps:
    - launch.py
    - cloud.py
    - gpu-workflow.yaml
    - data/pilot-overlay.tar
    metrics:
    - results/execution.json:
        cache: false
  cloud_collect:
    cmd: ../../../.venv/bin/python collect.py
    deps:
    - collect.py
    - cloud.py
    - results/execution.json
    outs:
    - data/collected
    metrics:
    - results/cleanup.json:
        cache: false
    - results/permission-removed.json:
        cache: false
  analysis:
    cmd: ../../../.venv/bin/python analyze.py
    deps:
    - analyze.py
    - data/collected
    - coverage-plan.json
    outs:
    - data/visuals
    metrics:
    - results/analysis.json:
        cache: false
  progress_snapshot:
    cmd: ../../../.venv/bin/python plot_progress.py
    deps:
    - plot_progress.py
    - results/execution.json
    always_changed: true
    outs:
    - data/progress
  archive_inventory:
    cmd: ../../../.venv/bin/python finalize_archive.py --inventory-only
    deps:
    - finalize_archive.py
    - data/collected
    outs:
    - data/checkpoint-inventory.json
    metrics:
    - results/archive-preservation.json:
        cache: false
  time20_analysis:
    cmd: ../../../.venv/bin/python analyze_time20.py
    deps:
    - analyze_time20.py
    - cases.json
    - data/collected/time-010-report.json
    - data/collected/time-010-epoch-300-counts.npz
    outs:
    - data/time20
    metrics:
    - results/time20-summary.json:
        cache: false
