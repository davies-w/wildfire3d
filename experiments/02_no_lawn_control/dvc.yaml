# Experiment 02: the same garden with no lawn, a control.
#
# `dvc repro` runs this file; `dvc.lock` is committed.  Outputs are tracked
# where FDS writes them.  The .s3d volumes are uncached: DVC knows this stage
# produces them and will re-solve when they are missing, but never copies or
# pushes them.
stages:
  solve:
    wdir: ../..
    cmd: >-
      python3 scripts/run_fds.py experiments/02_no_lawn_control/garden_nolawn.fds --threads 4
      && python3 scripts/strip_terrain.py FDS/cases/garden_nolawn garden_nolawn
    deps:
      - experiments/02_no_lawn_control/garden_nolawn.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - FDS/cases/garden_nolawn/garden_nolawn_1.prt5
      - FDS/cases/garden_nolawn/garden_nolawn_1_1.bf
      - FDS/cases/garden_nolawn/garden_nolawn_1_2.bf
      - FDS/cases/garden_nolawn/garden_nolawn_1_1.sf
      - FDS/cases/garden_nolawn/garden_nolawn_1_2.sf
      - FDS/cases/garden_nolawn/garden_nolawn.smv
      - FDS/cases/garden_nolawn/garden_nolawn_1_1.s3d:
          cache: false
      - FDS/cases/garden_nolawn/garden_nolawn_1_2.s3d:
          cache: false
      - FDS/cases/garden_nolawn/garden_nolawn_1_3.s3d:
          cache: false
