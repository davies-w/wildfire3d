main:
  steps:
  - init:
      assign:
      - candidates:
        - id: canary
          job_id: fds-tree49-compact01-canary
          label: tree49-compact01-canary
          region: us-central1
          zones:
          - us-central1-a
          - us-central1-b
          - us-central1-c
          job:
            taskGroups:
            - taskCount: '4'
              parallelism: '4'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 28000
                maxRunDuration: 10800s
                maxRetryCount: 0
                environment:
                  variables:
                    PILOT_GROUP: canary
                runnables:
                - container:
                    imageUri: us-central1-docker.pkg.dev/tmrw-wildfire-20261015/fds/solver48@sha256:2f27d44c854922f94f96a0c4137e1b092931022cf4294e1f89f888a56fd76443
                    entrypoint: python3
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --cpus=4 --memory=28000m --pids-limit=256
            allocationPolicy:
              instances:
              - policy:
                  machineType: c3-highmem-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '30'
                    type: pd-balanced
              location:
                allowedLocations:
                - zones/us-central1-a
                - zones/us-central1-b
                - zones/us-central1-c
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: tree49-compact01-canary
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/fds-trial
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-central1/subnetworks/fds-trial
            labels:
              trial_id: tree49-compact01-canary
            logsPolicy:
              destination: CLOUD_LOGGING
        - id: bulk
          job_id: fds-tree49-compact01-bulk
          label: tree49-compact01-bulk
          region: us-central1
          zones:
          - us-central1-a
          - us-central1-b
          - us-central1-c
          job:
            taskGroups:
            - taskCount: '18'
              parallelism: '18'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 28000
                maxRunDuration: 10800s
                maxRetryCount: 0
                environment:
                  variables:
                    PILOT_GROUP: bulk
                runnables:
                - container:
                    imageUri: us-central1-docker.pkg.dev/tmrw-wildfire-20261015/fds/solver48@sha256:2f27d44c854922f94f96a0c4137e1b092931022cf4294e1f89f888a56fd76443
                    entrypoint: python3
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --cpus=4 --memory=28000m --pids-limit=256
            allocationPolicy:
              instances:
              - policy:
                  machineType: c3-highmem-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '30'
                    type: pd-balanced
              location:
                allowedLocations:
                - zones/us-central1-a
                - zones/us-central1-b
                - zones/us-central1-c
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: tree49-compact01-bulk
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/fds-trial
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-central1/subnetworks/fds-trial
            labels:
              trial_id: tree49-compact01-bulk
            logsPolicy:
              destination: CLOUD_LOGGING
  - write_probe1:
      call: http.post
      args:
        url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
        auth:
          type: OAuth2
        query:
          uploadType: media
          name: ${"tree49/compact01/readiness-status." + string(sys.now())}
          ifGenerationMatch: 0
        headers:
          Content-Type: application/json
        body:
          passed: true
  - write_probe2:
      call: http.post
      args:
        url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
        auth:
          type: OAuth2
        query:
          uploadType: media
          name: ${"tree49/compact01/readiness-status." + string(sys.now())}
          ifGenerationMatch: 0
        headers:
          Content-Type: application/json
        body:
          passed: true
  - quota_probe:
      call: await_quota
      args:
        c:
          id: bulk
          job_id: fds-tree49-compact01-bulk
          label: tree49-compact01-bulk
          region: us-central1
          zones:
          - us-central1-a
          - us-central1-b
          - us-central1-c
          job:
            taskGroups:
            - taskCount: '18'
              parallelism: '18'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 28000
                maxRunDuration: 10800s
                maxRetryCount: 0
                environment:
                  variables:
                    PILOT_GROUP: bulk
                runnables:
                - container:
                    imageUri: us-central1-docker.pkg.dev/tmrw-wildfire-20261015/fds/solver48@sha256:2f27d44c854922f94f96a0c4137e1b092931022cf4294e1f89f888a56fd76443
                    entrypoint: python3
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --cpus=4 --memory=28000m --pids-limit=256
            allocationPolicy:
              instances:
              - policy:
                  machineType: c3-highmem-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '30'
                    type: pd-balanced
              location:
                allowedLocations:
                - zones/us-central1-a
                - zones/us-central1-b
                - zones/us-central1-c
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: tree49-compact01-bulk
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/fds-trial
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-central1/subnetworks/fds-trial
            labels:
              trial_id: tree49-compact01-bulk
            logsPolicy:
              destination: CLOUD_LOGGING
  - check:
      for:
        value: c
        in: ${candidates}
        steps:
        - inspect:
            call: inventory
            args:
              c: ${c}
            result: inv
        - empty:
            switch:
            - condition: ${len(inv.vms)>0 or len(inv.disks)>0}
              raise: Existing pilot resources
  - done:
      return:
        passed: true
inventory:
  params:
  - c
  steps:
  - init:
      assign:
      - vms: []
      - disks: []
  - zones:
      for:
        value: z
        in: ${c.zones}
        steps:
        - get_vms:
            try:
              call: http.get
              args:
                url: ${"https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/"
                  + z + "/instances"}
                auth:
                  type: OAuth2
                query:
                  filter: ${"labels.trial_id = " + c.label}
                  fields: items(name,selfLink,creationTimestamp,status),nextPageToken
                  maxResults: 500
              result: v
            retry: ${http.default_retry}
        - page_guard_v:
            switch:
            - condition: ${map.get(v.body,"nextPageToken") != null}
              raise: Unexpected inventory pagination; refuse partial inventory
        - append_vms:
            for:
              value: vm
              in: ${default(map.get(v.body,"items"),[])}
              steps:
              - add_vm:
                  assign:
                  - vms: ${list.concat(vms,vm)}
        - get_disks:
            try:
              call: http.get
              args:
                url: ${"https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/"
                  + z + "/disks"}
                auth:
                  type: OAuth2
                query:
                  filter: name eq fds-tree49-compact01-.*
                  fields: items(name,selfLink,users),nextPageToken
                  maxResults: 500
              result: d
            retry: ${http.default_retry}
        - page_guard_d:
            switch:
            - condition: ${map.get(d.body,"nextPageToken") != null}
              raise: Unexpected inventory pagination; refuse partial inventory
        - append_disks:
            for:
              value: disk
              in: ${default(map.get(d.body,"items"),[])}
              steps:
              - add_disk:
                  assign:
                  - disks: ${list.concat(disks,disk)}
  - done:
      return:
        vms: ${vms}
        disks: ${disks}
await_quota:
  params:
  - c
  steps:
  - init:
      assign:
      - deadline: ${sys.now()+14400}
  - canary:
      switch:
      - condition: ${c.id == "canary"}
        return: true
  - get:
      try:
        call: http.get
        args:
          url: https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/regions/us-central1
          auth:
            type: OAuth2
        result: q
      retry: ${http.default_retry}
  - reset:
      assign:
      - available: 0
  - quotas:
      for:
        value: item
        in: ${q.body.quotas}
        steps:
        - spot:
            switch:
            - condition: ${item.metric == "PREEMPTIBLE_CPUS"}
              assign:
              - available: ${item.limit-item.usage}
  - ready:
      switch:
      - condition: ${available >= 72}
        return: true
      - condition: ${sys.now()>deadline}
        raise: Spot CPU quota not granted within six hours; no bulk workers launched
  - wait:
      call: sys.sleep
      args:
        seconds: 60
      next: get
