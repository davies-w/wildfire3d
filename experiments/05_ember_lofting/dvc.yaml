# Experiment 05: do firebrands actually leave the boundary layer?
#
# `dvc repro` runs this file; `dvc.lock` is committed.  Outputs are tracked
# where FDS writes them; the .s3d volumes are uncached, so DVC knows this stage
# produces them without ever copying or pushing them.
stages:
  solve:
    wdir: ../..
    cmd: >-
      .venv/bin/python scripts/run_fds.py experiments/05_ember_lofting/garden_loft.fds --threads 4
      && .venv/bin/python scripts/strip_terrain.py FDS/cases/garden_loft garden_loft
    deps:
      - experiments/05_ember_lofting/garden_loft.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - FDS/cases/garden_loft/garden_loft_1.prt5
      - FDS/cases/garden_loft/garden_loft_1_1.bf
      - FDS/cases/garden_loft/garden_loft_1_2.bf
      - FDS/cases/garden_loft/garden_loft_1_1.sf
      - FDS/cases/garden_loft/garden_loft_1_2.sf
      - FDS/cases/garden_loft/garden_loft.smv
      - FDS/cases/garden_loft/garden_loft_1_1.s3d:
          cache: false
      - FDS/cases/garden_loft/garden_loft_1_2.s3d:
          cache: false
      - FDS/cases/garden_loft/garden_loft_1_3.s3d:
          cache: false
