  learning_interface:
    cmd: ../../.venv/bin/python validate_learning.py
    deps:
    - validate_learning.py
    - geometry_model.py
    - sequence.py
    - fortran_records.py
    - data/geometries.npz
    - development.json
    - fresh-tests.json
    - snapshot_evaluation.py
    metrics:
    - results/learning-interface-check.json:
        cache: false
  package_gpu:
    cmd: ../../.venv/bin/python prepare_gpu.py
    deps:
    - prepare_gpu.py
    - learning_worker.py
    - preprocess_cloud.py
    - fields.py
    - material_reader.py
    - fortran_records.py
    - geometry_model.py
    - sequence.py
    - development.json
    - fresh-tests.json
    - groups.json
    - data/geometries.npz
    - evaluation-plan.json
    - snapshot_evaluation.py
    - original_cnn.py
    - results/cloud-data-check.json
    outs:
    - data/learning-overlay.tar
  cloud_development:
    cmd: ../../.venv/bin/python dispatch_development.py
    deps:
    - dispatch_development.py
    - coverage_review.py
    - cloud.py
    - worker.py
    - runner-template.py
    - groups.json
    - data/decks
    outs:
    - data/summaries
  cloud_learning:
    cmd: ../../.venv/bin/python launch_learning.py
    deps:
    - launch_learning.py
    - gpu-workflow.yaml
    - data/learning-overlay.tar
    - results/development-complete.json
    metrics:
    - results/gpu-execution.json:
        cache: false
  collect_learning:
    cmd: ../../.venv/bin/python collect_learning.py
    deps:
    - collect_learning.py
    - results/gpu-execution.json
    outs:
    - data/gpu/cloud
    metrics:
    - results/learning-collected.json:
        cache: false
  cloud_test:
    cmd: ../../.venv/bin/python dispatch_tests.py
    deps:
    - dispatch_tests.py
    - results/learning-collected.json
    - results/prediction-freeze.json
    - groups.json
    metrics:
    - results/test-simulations-complete.json:
        cache: false
  prepare_evaluation:
    cmd: ../../.venv/bin/python prepare_evaluation.py
    deps:
    - prepare_evaluation.py
    - evaluate_cloud.py
    - results/test-simulations-complete.json
    - results/prediction-freeze.json
    outs:
    - data/evaluation-overlay.tar
  cloud_evaluation:
    cmd: ../../.venv/bin/python launch_evaluation.py
    deps:
    - launch_evaluation.py
    - evaluation-workflow.yaml
    - data/evaluation-overlay.tar
    metrics:
    - results/evaluation-execution.json:
        cache: false
  collect_evaluation:
    cmd: ../../.venv/bin/python collect_evaluation.py
    deps:
    - collect_evaluation.py
    - results/evaluation-execution.json
    outs:
    - data/evaluation
    metrics:
    - results/fresh-test-evaluation.json:
        cache: false
  visualize:
    cmd: ../../.venv/bin/python visualize_results.py
    deps:
    - visualize_results.py
    - data/evaluation
    - results/fresh-test-evaluation.json
    outs:
    - results/fresh-histories.png:
        cache: false
  audit_splits:
    cmd: ../../.venv/bin/python audit_splits.py
    deps:
    - audit_splits.py
    - development.json
    - fresh-tests.json
    metrics:
    - results/full-split-audit.json:
        cache: false
  coverage_review:
    cmd: ../../.venv/bin/python coverage_review.py
    deps:
    - coverage_review.py
    - data/geometries.npz
    - jobs/x32-coverage-00-r1/completion.json
    - results/input-freeze.json
    outs:
    - data/downloads
    - data/coverage
    metrics:
    - results/coverage-review.json:
        cache: false
  cloud_data_check:
    cmd: ../../.venv/bin/python validate_cloud_data.py
    deps:
    - validate_cloud_data.py
    - preprocess_cloud.py
    - fields.py
    - fortran_records.py
    - material_reader.py
    - data/downloads
    - data/geometries.npz
    metrics:
    - results/cloud-data-check.json:
        cache: false
