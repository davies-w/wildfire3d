stages:
  setup:
    cmd: ../../.venv/bin/python setup.py
    deps:
    - setup.py
    - legacy_single.py
    - legacy_build.py
    - base-input.fds
    - data/original-template.json
    - ../31_tree_variations/development.json
    outs:
    - data/decks
    - data/tree-templates.json
  validate:
    cmd: ../../.venv/bin/python validate.py
    deps:
    - validate.py
    - cases.json
    - results/input-freeze.json
    - data/decks
    metrics:
    - results/validation.json:
        cache: false
  preflight:
    cmd: ../../.venv/bin/python preflight.py
    deps:
    - preflight.py
    - particle_reader.py
    - cases.json
    - data/decks
    - data/tree-templates.json
    - ../27_single_tree_cnn/data/cloud/s27_train_0/s27_train_0_1.prt5
    outs:
    - data/preflight
    metrics:
    - results/preflight.json:
        cache: false
  prepare_learning_inputs:
    cmd: ../../.venv/bin/python prepare_inputs.py
    deps:
    - prepare_inputs.py
    - cases.json
    - reuse.json
    - data/tree-templates.json
    - ../31_tree_variations/data/geometries.npz
    outs:
    - data/geometries.npz
