    - data/s27_train_29-material.npz
    - data/s27_train_30-material.npz
    - data/s27_train_31-material.npz
    - data/s27_validation_0-material.npz
    - data/s27_validation_1-material.npz
    - data/s27_validation_2-material.npz
    - data/s27_validation_3-material.npz
    - data/s27_validation_4-material.npz
    - data/s27_validation_5-material.npz
    - data/v31_00-material.npz
    - data/v31_01-material.npz
    - data/v31_02-material.npz
    - data/v31_03-material.npz
