stages:
  prepare:
    cmd: python prepare.py && python package.py
    deps:
    - prepare.py
    - objective.py
    - package.py
    - cloud_check.py
    outs:
    - data/training01:
        persist: true
  validate:
    cmd: python validate.py
    deps:
    - validate.py
    - data/training01
    outs:
    - results/offline-check.json
  package02:
    cmd: python package02.py
    deps:
    - package02.py
    - cloud_check02.py
    outs:
    - data/training02:
        persist: true
  validate02:
    cmd: python validate02.py
    deps:
    - validate02.py
    - data/training02
    outs:
    - results02/offline-check.json
  package03:
    cmd: python prepare03.py && python package03.py
    deps:
    - prepare03.py
    - package03.py
    - cloud_check02.py
    - data/training02
    outs:
    - data/training03:
        persist: true
  validate03:
    cmd: python validate03.py
    deps:
    - validate03.py
    - data/training03
    outs:
    - results03/offline-check.json
  adopt_wait:
    cmd: python adopt_wait.py
    deps:
    - adopt_wait.py
    - data/training03/workflow.yaml
    outs:
    - data/wait-supervisor:
        persist: true
  audit_startup:
    cmd: python audit_startup.py
    deps:
    - audit_startup.py
    outs:
    - data/startup-audit
  collect:
    cmd: python collect.py
    deps:
    - collect.py
    outs:
    - data/training03-results:
        persist: true
  analyze:
    cmd: python analyze.py
    deps:
    - analyze.py
    - data/training03-results
    - results/training03-collected.json
    outs:
    - data/analysis
  build_public:
    cmd: python build_public.py
    deps:
    - build_public.py
    - data/analysis
    outs:
    - data/public:
        persist: true
