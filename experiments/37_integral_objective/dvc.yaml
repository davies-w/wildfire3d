stages:
  prepare:
    cmd: python prepare.py && python package.py
    deps:
    - prepare.py
    - objective.py
    - package.py
    - cloud_check.py
    outs:
    - data/training01:
        persist: true
  validate:
    cmd: python validate.py
    deps:
    - validate.py
    - data/training01
    outs:
    - results/offline-check.json
  package02:
    cmd: python package02.py
    deps:
    - package02.py
    - cloud_check02.py
    outs:
    - data/training02:
        persist: true
  validate02:
    cmd: python validate02.py
    deps:
    - validate02.py
    - data/training02
    outs:
    - results02/offline-check.json
  package03:
    cmd: python prepare03.py && python package03.py
    deps:
    - prepare03.py
    - package03.py
    - cloud_check02.py
    - data/training02
    outs:
    - data/training03:
        persist: true
  validate03:
    cmd: python validate03.py
    deps:
    - validate03.py
    - data/training03
    outs:
    - results03/offline-check.json
  adopt_wait:
    cmd: python adopt_wait.py
    deps:
    - adopt_wait.py
    - data/training03/workflow.yaml
    outs:
    - data/wait-supervisor:
        persist: true
  audit_startup:
    cmd: python audit_startup.py
    deps:
    - audit_startup.py
    outs:
    - data/startup-audit
  collect:
    cmd: python collect.py
    deps:
    - collect.py
    outs:
    - data/training03-results:
        persist: true
  analyze:
    cmd: python analyze.py
    deps:
    - analyze.py
    - data/training03-results
    - results/training03-collected.json
    outs:
    - data/analysis
  build_public:
    cmd: python build_public.py
    deps:
    - build_public.py
    - data/analysis
    outs:
    - data/public:
        persist: true
  add_full_sequence:
    cmd: python add_to_full_sequence.py
    deps:
    - add_to_full_sequence.py
    - data/public
    outs:
    - data/scorecard-addition:
        persist: true
  add_prior_curve:
    cmd: python add_prior_curve.py
    deps:
    - add_prior_curve.py
    - data/scorecard-addition
    - data/analysis
    - ../36_tree_density/data/full-sequence/stridegated.json
    outs:
    - data/prior-overlay
  prepare04:
    cmd: python prepare04.py
    deps:
    - prepare04.py
    - cloud_check02.py
    - data/training03
    - ../36_tree_density/data/model-training/schema.json
    outs:
    - data/training04:
        persist: true
  validate04:
    cmd: python validate04.py
    deps:
    - validate04.py
    - data/training04
    outs:
    - results04/offline-check.json
  audit_startup04:
    cmd: python audit_startup04.py
    deps:
    - audit_startup04.py
    outs:
    - data/startup-audit04
  collect04:
    cmd: python collect04.py
    deps:
    - collect04.py
    outs:
    - data/training04-results:
        persist: true
  analyze04:
    cmd: python analyze04.py
    deps:
    - analyze04.py
    - data/training04-results
    - data/training04/schema.json
    outs:
    - data/analysis04
  build_public04:
    cmd: python build_public04.py && python add_to_full_sequence04.py
    deps:
    - build_public04.py
    - add_to_full_sequence04.py
    - data/analysis04
    outs:
    - data/public04
    - data/scorecard-addition04
  preserve04:
    cmd: python preserve04.py
    deps:
    - preserve04.py
    outs:
    - data/provenance04
  prepare05:
    cmd: python prepare05.py
    deps:
    - prepare05.py
    - cloud_check02.py
    - data/training03
    - ../36_tree_density/data/model-training/schema.json
    outs:
    - data/training05:
        persist: true
  validate05:
    cmd: python validate05.py
    deps:
    - validate05.py
    - data/training05
    outs:
    - results05/offline-check.json
  audit_startup05:
    cmd: python audit_startup05.py
    deps:
    - audit_startup05.py
    outs:
    - data/startup-audit05
  collect05:
    cmd: python collect05.py
    deps:
    - collect05.py
    outs:
    - data/training05-results:
        persist: true
  scorecard_layout:
    cmd: python reorganize_scorecard.py
    deps:
    - reorganize_scorecard.py
    outs:
    - data/scorecard-layout
  preserve05:
    cmd: python preserve05.py
    deps:
    - preserve05.py
    outs:
    - data/provenance05
