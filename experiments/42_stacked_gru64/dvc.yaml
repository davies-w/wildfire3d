stages:
  prepare:
    cmd: ../../.venv/bin/python prepare.py && ../../.venv/bin/python build_pool.py
    deps:
    - prepare.py
    - build_pool.py
    - worker.py
    - cloud_check.py
    - ../41_dropout10_from_start/data/training
    - ../38_history8_shared64/data/training08/bootstrap.py
    - ../38_history8_shared64/data/training08/workflow.yaml
    - gated_model.py
    outs:
    - data/training:
        persist: true
  progress:
    cmd: ../../.venv/bin/python snapshot_progress.py
    deps:
    - snapshot_progress.py
    - plot_learning_curve.py
    outs:
    - data/progress-public:
        persist: true
  preserve:
    cmd: ../../.venv/bin/python preserve.py
    deps:
    - preserve.py
    outs:
    - data/provenance:
        persist: true
  collect:
    cmd: ../../.venv/bin/python collect.py
    deps:
    - collect.py
    outs:
    - data/pool03-results:
        persist: true
  prepare_pool02:
    cmd: ../../.venv/bin/python prepare_pool02.py
    deps:
    - prepare_pool02.py
    - build_pool02.py
    - gated_model02.py
    - cloud_check.py
    - data/training
    outs:
    - data/training02:
        persist: true
  prepare_pool03:
    cmd: ../../.venv/bin/python prepare_pool03.py
    deps:
    - prepare_pool03.py
    - build_pool03.py
    - cloud_check03.py
    - data/training02
    outs:
    - data/training03:
        persist: true
