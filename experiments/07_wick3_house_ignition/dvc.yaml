# Experiment 07: the house ignites.
#
# 0.5 m cells over 32 x 24 x 12 m, 350 s. Solver output goes to data/. The
# Retained Smoke3D volumes are cached for archival recovery. Preservation
# adopts the existing bytes; it does not rerun or validate the simulation.
stages:
  solve:
    wdir: ../..
    cmd: >-
      .venv/bin/python scripts/run_fds.py
      experiments/07_wick3_house_ignition/wick3c.fds:experiments/07_wick3_house_ignition/data
      --threads 4
      && .venv/bin/python scripts/strip_terrain.py experiments/07_wick3_house_ignition/data wick3c
    deps:
      - experiments/07_wick3_house_ignition/wick3c.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - experiments/07_wick3_house_ignition/data/wick3c_1.restart
      - experiments/07_wick3_house_ignition/data/wick3c.smv
      - experiments/07_wick3_house_ignition/data/wick3c_1.prt5
      - experiments/07_wick3_house_ignition/data/wick3c_1_1.bf
      - experiments/07_wick3_house_ignition/data/wick3c_1_2.bf
      - experiments/07_wick3_house_ignition/data/wick3c_1_1.sf
      - experiments/07_wick3_house_ignition/data/wick3c_1_2.sf
      - experiments/07_wick3_house_ignition/data/wick3c_1_1.s3d:
          cache: true
      - experiments/07_wick3_house_ignition/data/wick3c_1_2.s3d:
          cache: true
      - experiments/07_wick3_house_ignition/data/wick3c_1_3.s3d:
          cache: true

  boundary:
    wdir: ../..
    cmd: >-
      .venv/bin/python scripts/surface_temp.py
      experiments/07_wick3_house_ignition/render.json
    deps:
      - experiments/07_wick3_house_ignition/render.json
      - experiments/07_wick3_house_ignition/data/wick3c_1_1.bf
      - experiments/07_wick3_house_ignition/data/wick3c_1_2.bf
      - scripts/surface_temp.py
      - scripts/case_config.py
    outs:
      - experiments/07_wick3_house_ignition/data/ign_state.json

  render:
    wdir: ../..
    cmd: >-
      .venv/bin/python scripts/render_animation.py
      experiments/07_wick3_house_ignition/render.json
    deps:
      - experiments/07_wick3_house_ignition/render.json
      - experiments/07_wick3_house_ignition/view.ini
      - experiments/07_wick3_house_ignition/data/ign_state.json
      - experiments/07_wick3_house_ignition/data/wick3c.smv
      - experiments/07_wick3_house_ignition/data/wick3c_1_1.s3d
      - experiments/07_wick3_house_ignition/data/wick3c_1_3.s3d
      - experiments/07_wick3_house_ignition/data/wick3c_1.prt5
      - scripts/render_animation.py
      - scripts/case_config.py
    outs:
      - experiments/07_wick3_house_ignition/results:
          cache: false

  validate:
    wdir: ../..
    cmd: >-
      .venv/bin/python scripts/validate_animation.py
      experiments/07_wick3_house_ignition/render.json
    deps:
      - experiments/07_wick3_house_ignition/render.json
      - experiments/07_wick3_house_ignition/results
      - experiments/07_wick3_house_ignition/data/ign_state.json
      - scripts/validate_animation.py
