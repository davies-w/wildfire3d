# Experiment 07: the house ignites.
#
# `dvc repro` runs this file; `dvc.lock` is committed.  The case directory is
# FDS/cases/wick3 while the CHID is wick3c, so the runner is told the directory
# explicitly; the outputs themselves are named from the CHID.
#
# The .s3d volumes carry `cache: false`: outputs DVC knows about, tracks and can
# re-solve when missing, but never copies or pushes.  The gif and stills stay in
# git so they render on GitHub, and are uncached for the same reason.
stages:
  solve:
    wdir: ../..
    cmd: >-
      .venv/bin/python scripts/run_fds.py
      experiments/07_wick3_house_ignition/wick3c.fds
      --case wick3 --threads 4
      && .venv/bin/python scripts/strip_terrain.py FDS/cases/wick3 wick3c
    deps:
      - experiments/07_wick3_house_ignition/wick3c.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - FDS/cases/wick3/wick3c.smv
      - FDS/cases/wick3/wick3c_1.prt5
      - FDS/cases/wick3/wick3c_1_1.bf
      - FDS/cases/wick3/wick3c_1_2.bf
      - FDS/cases/wick3/wick3c_1_1.sf
      - FDS/cases/wick3/wick3c_1_2.sf
      - FDS/cases/wick3/wick3c_1_1.s3d:
          cache: false
      - FDS/cases/wick3/wick3c_1_3.s3d:
          cache: false

  boundary:
    wdir: ../..
    cmd: .venv/bin/python scripts/surface_temp.py experiments/07_wick3_house_ignition/render.json
    deps:
      - experiments/07_wick3_house_ignition/render.json
      - FDS/cases/wick3/wick3c_1_1.bf
      - FDS/cases/wick3/wick3c_1_2.bf
      - scripts/surface_temp.py
    outs:
      - FDS/cases/wick3/ign_state.json

  render:
    wdir: ../..
    cmd: .venv/bin/python scripts/render_animation.py experiments/07_wick3_house_ignition/render.json
    deps:
      - experiments/07_wick3_house_ignition/render.json
      - FDS/cases/wick3/ign_state.json
      - FDS/cases/wick3/wick3c.smv
      - FDS/cases/wick3/wick3c_1_1.s3d
      - FDS/cases/wick3/wick3c_1_3.s3d
      - FDS/cases/wick3/wick3c_1.prt5
      - scripts/render_animation.py
      - scripts/case_config.py
    outs:
      - experiments/07_wick3_house_ignition/results:
          cache: false

  validate:
    wdir: ../..
    cmd: .venv/bin/python scripts/validate_animation.py experiments/07_wick3_house_ignition/render.json
    deps:
      - experiments/07_wick3_house_ignition/render.json
      - experiments/07_wick3_house_ignition/results
      - FDS/cases/wick3/ign_state.json
      - scripts/validate_animation.py
