main:
  steps:
  - initialize:
      assign:
      - candidates:
        - id: or
          region: us-west1
          zones:
          - us-west1-a
          - us-west1-b
          label: gpu40-pool02-or
          job_id: fds-gpu40-pool02-or
          job:
            taskGroups:
            - taskCount: '1'
              parallelism: '1'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 12000
                maxRunDuration: 45900s
                maxRetryCount: 0
                runnables:
                - container:
                    imageUri: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
                    entrypoint: python
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --shm-size=1g
                environment:
                  variables:
                    TRAINING_SOFT_SECONDS: '45000'
                    OUTPUT_PREFIX: dropout40/pool02/or/
                    CANDIDATE_ID: or
            allocationPolicy:
              instances:
              - policy:
                  machineType: n1-standard-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '60'
                    type: pd-balanced
                  accelerators:
                  - type: nvidia-tesla-t4
                    count: 1
                installGpuDrivers: true
              location:
                allowedLocations:
                - zones/us-west1-a
                - zones/us-west1-b
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: gpu40-pool02-or
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/fds-trial
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-west1/subnetworks/fds-timing-west1
            labels:
              trial_id: gpu40-pool02-or
            logsPolicy:
              destination: CLOUD_LOGGING
        - id: ia
          region: us-central1
          zones:
          - us-central1-a
          - us-central1-b
          - us-central1-c
          - us-central1-f
          label: gpu40-pool02-ia
          job_id: fds-gpu40-pool02-ia
          job:
            taskGroups:
            - taskCount: '1'
              parallelism: '1'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 12000
                maxRunDuration: 45900s
                maxRetryCount: 0
                runnables:
                - container:
                    imageUri: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
                    entrypoint: python
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --shm-size=1g
                environment:
                  variables:
                    TRAINING_SOFT_SECONDS: '45000'
                    OUTPUT_PREFIX: dropout40/pool02/ia/
                    CANDIDATE_ID: ia
            allocationPolicy:
              instances:
              - policy:
                  machineType: n1-standard-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '60'
                    type: pd-balanced
                  accelerators:
                  - type: nvidia-tesla-t4
                    count: 1
                installGpuDrivers: true
              location:
                allowedLocations:
                - zones/us-central1-a
                - zones/us-central1-b
                - zones/us-central1-c
                - zones/us-central1-f
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: gpu40-pool02-ia
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/fds-trial
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-central1/subnetworks/fds-trial
            labels:
              trial_id: gpu40-pool02-ia
            logsPolicy:
              destination: CLOUD_LOGGING
        - id: sc
          region: us-east1
          zones:
          - us-east1-b
          - us-east1-c
          - us-east1-d
          label: gpu40-pool02-sc
          job_id: fds-gpu40-pool02-sc
          job:
            taskGroups:
            - taskCount: '1'
              parallelism: '1'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 12000
                maxRunDuration: 45900s
                maxRetryCount: 0
                runnables:
                - container:
                    imageUri: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
                    entrypoint: python
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --shm-size=1g
                environment:
                  variables:
                    TRAINING_SOFT_SECONDS: '45000'
                    OUTPUT_PREFIX: dropout40/pool02/sc/
                    CANDIDATE_ID: sc
            allocationPolicy:
              instances:
              - policy:
                  machineType: n1-standard-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '60'
                    type: pd-balanced
                  accelerators:
                  - type: nvidia-tesla-t4
                    count: 1
                installGpuDrivers: true
              location:
                allowedLocations:
                - zones/us-east1-b
                - zones/us-east1-c
                - zones/us-east1-d
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: gpu40-pool02-sc
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/default
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-east1/subnetworks/default
            labels:
              trial_id: gpu40-pool02-sc
            logsPolicy:
              destination: CLOUD_LOGGING
      - winner: null
      - final_state: UNKNOWN
  - race:
      try:
        steps:
        - create_jobs:
            for:
              value: c
              in: ${candidates}
              steps:
              - create:
                  call: http.post
                  args:
                    url: ${"https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/"
                      + c.region + "/jobs"}
                    auth:
                      type: OAuth2
                    query:
                      jobId: ${c.job_id}
                    body: ${c.job}
                  result: created
        - reset:
            assign:
            - viable: 0
        - scan:
            for:
              value: c
              in: ${candidates}
              steps:
              - get:
                  call: http.get
                  args:
                    url: ${"https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/"
                      + c.region + "/jobs/" + c.job_id}
                    auth:
                      type: OAuth2
                  result: state
              - save_status:
                  call: http.post
                  args:
                    url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
                    auth:
                      type: OAuth2
                    query:
                      uploadType: media
                      name: ${"dropout40/pool02/" + c.id + "/job-status.json" + "."
                        + string(sys.now())}
                    headers:
                      Content-Type: application/json
                    body: ${state.body}
              - inv:
                  call: inventory
                  args:
                    c: ${c}
                  result: inv
              - eligible:
                  switch:
                  - condition: ${state.body.status.state != "FAILED" and state.body.status.state
                      != "SUCCEEDED"}
                    steps:
                    - increment:
                        assign:
                        - viable: ${viable+1}
                    - choose:
                        switch:
                        - condition: ${winner == null and len(inv.vms) > 0 and inv.vms[0].status
                            == "RUNNING"}
                          assign:
                          - winner: ${c}
        - selected:
            switch:
            - condition: ${winner != null}
              next: remove_losers
            - condition: ${viable == 0}
              raise: All regional jobs failed before ownership grant
        - queue_wait:
            call: sys.sleep
            args:
              seconds: 30
            next: reset
        - remove_losers:
            for:
              value: c
              in: ${candidates}
              steps:
              - loser:
                  switch:
                  - condition: ${c.id != winner.id}
                    steps:
                    - clean:
                        call: cleanup
                        args:
                          c: ${c}
        - grant:
            call: http.post
            args:
              url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
              auth:
                type: OAuth2
              query:
                uploadType: media
                name: dropout40/pool02/race-winner.json
                ifGenerationMatch: 0
              headers:
                Content-Type: application/json
              body:
                winner: ${winner.id}
                losers_cleanup_verified: true
                selected_at: ${time.format(sys.now())}
        - set_current:
            assign:
            - current: ${winner}
        - running:
            call: http.get
            args:
              url: ${"https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/"
                + current.region + "/jobs/" + current.job_id}
              auth:
                type: OAuth2
            result: state
        - save_winner_status:
            call: http.post
            args:
              url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
              auth:
                type: OAuth2
              query:
                uploadType: media
                name: ${"dropout40/pool02/" + current.id + "/job-status.json" + "."
                  + string(sys.now())}
              headers:
                Content-Type: application/json
              body: ${state.body}
        - terminal:
            switch:
            - condition: ${state.body.status.state == "SUCCEEDED" or state.body.status.state
                == "FAILED"}
              next: finished
        - allocated:
            call: inventory
            args:
              c: ${current}
            result: inv
        - age_check:
            for:
              value: vm
              in: ${inv.vms}
              steps:
              - overdue:
                  switch:
                  - condition: ${sys.now() >= time.parse(vm.creationTimestamp) + 46800}
                    raise: VM lifetime limit reached; preserve completed checkpoints
        - training_wait:
            call: sys.sleep
            args:
              seconds: 30
            next: running
        - finished:
            assign:
            - final_state: ${state.body.status.state}
      except:
        as: failure
        steps:
        - save_failure:
            call: http.post
            args:
              url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
              auth:
                type: OAuth2
              query:
                uploadType: media
                name: dropout40/pool02/controller-error.json
              headers:
                Content-Type: application/json
              body: ${failure}
        - cleanup_failed:
            for:
              value: c
              in: ${candidates}
              steps:
              - clean_failed:
                  call: cleanup
                  args:
                    c: ${c}
        - rethrow:
            raise: ${failure}
  - cleanup_terminal:
      for:
        value: c
        in: ${candidates}
        steps:
        - clean_terminal:
            call: cleanup
            args:
              c: ${c}
  - done:
      return:
        winner: ${winner.id}
        batch_state: ${final_state}
        cleanup_verified: true
inventory:
  params:
  - c
  steps:
  - init:
      assign:
      - vms: []
      - disks: []
  - zones:
      for:
        value: z
        in: ${c.zones}
        steps:
        - get_vms:
            call: http.get
            args:
              url: ${"https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/"
                + z + "/instances"}
              auth:
                type: OAuth2
              query:
                filter: ${"labels.trial_id = " + c.label}
            result: v
        - append_vms:
            for:
              value: vm
              in: ${default(map.get(v.body,"items"),[])}
              steps:
              - add_vm:
                  assign:
                  - vms: ${list.concat(vms,vm)}
        - get_disks:
            call: http.get
            args:
              url: ${"https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/"
                + z + "/disks"}
              auth:
                type: OAuth2
              query:
                filter: ${"labels.trial_id = " + c.label}
            result: d
        - append_disks:
            for:
              value: disk
              in: ${default(map.get(d.body,"items"),[])}
              steps:
              - add_disk:
                  assign:
                  - disks: ${list.concat(disks,disk)}
  - done:
      return:
        vms: ${vms}
        disks: ${disks}
cleanup:
  params:
  - c
  steps:
  - delete_job:
      try:
        call: http.delete
        args:
          url: ${"https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/"
            + c.region + "/jobs/" + c.job_id}
          auth:
            type: OAuth2
      except:
        as: err
        steps:
        - unexpected_1:
            switch:
            - condition: ${map.get(err,"code") != 404}
              raise: ${err}
  - inventory:
      call: inventory
      args:
        c: ${c}
      result: inv
  - delete_vms:
      for:
        value: vm
        in: ${inv.vms}
        steps:
        - delete_vm:
            try:
              call: http.delete
              args:
                url: ${vm.selfLink}
                auth:
                  type: OAuth2
            except:
              as: err
              steps:
              - unexpected_2:
                  switch:
                  - condition: ${map.get(err,"code") != 404}
                    raise: ${err}
  - wait:
      call: sys.sleep
      args:
        seconds: 15
  - verify:
      call: inventory
      args:
        c: ${c}
      result: left
  - empty:
      switch:
      - condition: ${len(left.vms) > 0 or len(left.disks) > 0}
        next: wait
  - job_present:
      assign:
      - present: true
  - verify_job:
      try:
        call: http.get
        args:
          url: ${"https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/"
            + c.region + "/jobs/" + c.job_id}
          auth:
            type: OAuth2
        result: remaining
      except:
        as: e
        steps:
        - gone:
            switch:
            - condition: ${map.get(e,"code") == 404}
              assign:
              - present: false
            - condition: ${true}
              raise: ${e}
  - job_wait:
      switch:
      - condition: ${present}
        next: wait
  - done:
      return:
        empty: true
