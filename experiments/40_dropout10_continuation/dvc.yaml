stages:
  prepare:
    cmd: ../../.venv/bin/python prepare.py && ../../.venv/bin/python build_pool.py
    deps:
    - prepare.py
    - build_pool.py
    - ../39_long_window_continuation/data/training02
    - ../39_long_window_continuation/data/pool02-results
    - ../38_history8_shared64/data/training08/bootstrap.py
    - ../38_history8_shared64/data/training08/workflow.yaml
    outs:
    - data/training:
        persist: true
  preserve:
    cmd: ../../.venv/bin/python preserve.py
    deps:
    - preserve.py
    outs:
    - data/provenance:
        persist: true
  progress:
    cmd: ../../.venv/bin/python snapshot_progress.py
    deps:
    - snapshot_progress.py
    - plot_learning_curve.py
    outs:
    - data/progress-public:
        persist: true
  collect:
    cmd: ../../.venv/bin/python collect.py
    deps:
    - collect.py
    outs:
    - data/pool02-results:
        persist: true
  prepare_pool02:
    cmd: ../../.venv/bin/python repair_pool02.py
    deps:
    - repair_pool02.py
    - build_pool.py
    - launch.py
    - deploy.py
    - data/training
    outs:
    - data/training02:
        persist: true
  analysis:
    cmd: ../../.venv/bin/python analyze.py
    deps:
    - analyze.py
    - data/pool02-results
    - data/training02/data/sequences.npz
    - data/training02/schema.json
    outs:
    - data/analysis:
        persist: true
  public:
    cmd: ../../.venv/bin/python build_public.py
    deps:
    - build_public.py
    - data/analysis
    - data/training02/schema.json
    outs:
    - data/public:
        persist: true
  reports:
    cmd: ../../.venv/bin/python build_reports.py
    deps:
    - build_reports.py
    - data/analysis
    - data/public
    - ../39_long_window_continuation/data/analysis
    - ../39_long_window_continuation/data/public
    outs:
    - data/report-public:
        persist: true
