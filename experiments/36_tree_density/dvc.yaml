stages:
  template:
    cmd: ../../.venv/bin/python -c "import shutil; shutil.copyfile('../32_tree_expansion/data/tree-templates.json',
      'data/tree-templates.json')"
    deps:
    - ../32_tree_expansion/data/tree-templates.json
    outs:
    - data/tree-templates.json
  prepare:
    cmd: ../../.venv/bin/python prepare.py
    deps:
    - prepare.py
    - legacy_single.py
    - legacy_build.py
    - base-input.fds
    - data/tree-templates.json
    - ../32_tree_expansion/cases.json
    - ../32_tree_expansion/data/geometries.npz
    outs:
    - data/decks
    - data/coverage-geometries.npz
    - cases.json:
        cache: false
    metrics:
    - results/preflight.json:
        cache: false
  package:
    cmd: ../../.venv/bin/python cloud.py prepare
    deps:
    - cloud.py
    - worker.py
    - runner-template.py
    - transport.py
    - workflow-template.json
    - cases.json
    - data/decks
    - results/input-freeze.json
    outs:
    - data/packages
    - groups.json:
        cache: false
  transport_check:
    cmd: ../../.venv/bin/python validate_transport.py
    deps:
    - validate_transport.py
    - transport.py
    metrics:
    - results/transport-preflight.json:
        cache: false
  cloud_dispatch:
    cmd: ../../.venv/bin/python dispatch.py
    deps:
    - dispatch.py
    - cloud.py
    - coverage_review.py
    - material_reader.py
    - fortran_records.py
    - groups.json
    - data/packages
    - results/reserved.json
    - active-groups.json
    - results/repair-workflow-preflight.json
    outs:
    - data/summaries
    metrics:
    - results/simulations-complete.json:
        cache: false
  workflow_check:
    cmd: ../../.venv/bin/python validate_workflows.py
    deps:
    - validate_workflows.py
    - groups.json
    - data/packages
    metrics:
    - results/workflow-preflight.json:
        cache: false
  prepare_restore:
    cmd: ../../.venv/bin/python repair/prepare.py
    deps:
    - repair/prepare.py
    - repair/Dockerfile
    - ../16_code_profiling/data/binary/fds
    outs:
    - data/restore-context
    metrics:
    - results/restore-preflight.json:
        cache: false
  activate_restore:
    cmd: ../../.venv/bin/python repair/activate.py
    deps:
    - repair/activate.py
    - results/restore-build-status.json
    - groups.json
    - data/packages
    outs:
    - data/repair-packages
    - restored-groups.json:
        cache: false
  validate_restore:
    cmd: ../../.venv/bin/python repair/validate.py
    deps:
    - repair/validate.py
    - active-groups.json
    - data/repair-packages
    - data/packages
    metrics:
    - results/repair-workflow-preflight.json:
        cache: false
  prepare_queue_recovery:
    cmd: ../../.venv/bin/python repair/prepare_queue_recovery.py
    deps:
    - repair/prepare_queue_recovery.py
    - restored-groups.json
    - data/packages
    - jobs/x36-density-009/terminal-no-results.json
    - jobs/x36-density-010/terminal-no-results.json
    - jobs/x36-density-011/terminal-no-results.json
    - jobs/x36-density-012/terminal-no-results.json
    - jobs/x36-density-013/terminal-no-results.json
    - jobs/x36-density-014/terminal-no-results.json
    - jobs/x36-density-015/terminal-no-results.json
    - jobs/x36-density-016/terminal-no-results.json
    - jobs/x36-density-017/terminal-no-results.json
    - jobs/x36-density-018/terminal-no-results.json
    - jobs/x36-density-019/terminal-no-results.json
    - jobs/x36-density-020/terminal-no-results.json
    outs:
    - data/queue-recovery-packages
    - proposed-queue-recovery-groups.json:
        cache: false
  activate_queue_recovery:
    cmd: ../../.venv/bin/python repair/activate_queue_recovery.py
    deps:
    - repair/activate_queue_recovery.py
    - restored-groups.json
    - proposed-queue-recovery-groups.json
    - data/queue-recovery-packages
    outs:
    - active-groups.json:
        cache: false
    metrics:
    - results/queue-recovery-activation.json:
        cache: false
  cloud_queue_prepare:
    cmd: ../../.venv/bin/python orchestration/prepare.py && ../../.venv/bin/python
      orchestration/inline.py
    deps:
    - orchestration/prepare.py
    - orchestration/inline.py
    - active-groups.json
    - results/input-freeze.json
    outs:
    - orchestration/queue.json:
        cache: false
    - orchestration/run-queue.json:
        cache: false
    - orchestration/parent.yaml:
        cache: false
    - orchestration/parent-inline.yaml:
        cache: false
    - orchestration/specs:
        cache: false
    metrics:
    - orchestration/inline-equivalence.json:
        cache: false
    - orchestration/preflight.json:
        cache: false
  collect_cloud:
    cmd: ../../.venv/bin/python collect_cloud.py
    deps:
    - collect_cloud.py
    - cloud.py
    - active-groups.json
    - results/input-freeze.json
    outs:
    - data/cloud-collected
    metrics:
    - results/cloud-collection.json:
        cache: false
  prepare_partial_recovery:
    cmd: ../../.venv/bin/python repair/prepare_partial.py
    deps:
    - repair/prepare_partial.py
    - results/preemption-032.json
    - data/packages
    - active-groups.json
    outs:
    - data/partial-recovery
    metrics:
    - results/partial-recovery-plan.json:
        cache: false
  raw_inventory:
    cmd: ../../.venv/bin/python raw_inventory.py
    deps:
    - raw_inventory.py
    - active-groups.json
    - results/input-freeze.json
    - data/summaries
    - data/cloud-collected
    - data/interrupted
    - data/recovery-collected
    - results/partial-recovery-plan.json
    - data/late-recovery
    outs:
    - data/raw-inventory.json
  verify_material:
    cmd: ../../.venv/bin/python verify_material.py
    deps:
    - verify_material.py
    - cloud.py
    - data/raw-inventory.json
    - data/summaries
    - data/cloud-collected
    - data/interrupted
    - data/recovery-collected
    - results/partial-recovery-plan.json
    - data/late-recovery
    outs:
    - data/verified-material
  extract_states:
    cmd: ../../.venv/bin/python extract_states.py
    deps:
    - extract_states.py
    - material_reader.py
    - fortran_records.py
    - cases.json
    - data/verified-material
    outs:
    - data/four-state
    metrics:
    - results/four-state-extraction.json:
        cache: false
  validate_state_replay:
    cmd: ../../.venv/bin/python validate_state_replay.py
    deps:
    - validate_state_replay.py
    - extract_states.py
    - material_reader.py
    - fortran_records.py
    - ../35_surrogate_diagnostics/attempt12/inventory.json
    - ../35_surrogate_diagnostics/attempt20/data/sequences.npz
    - ../32_tree_expansion/data/cloud_archive/x32-coverage-00-r1/x32_000_s0.tar.gz
    - ../32_tree_expansion/data/cloud_archive/x32-development-08-r1/x32_094_s0.tar.gz
    - ../32_tree_expansion/data/cloud_archive/x32-development-33/x32_376_s0.tar.gz
    outs:
    - data/extraction-replay
    metrics:
    - results/extraction-replay.json:
        cache: false
  prepare_partial_workflow:
    cmd: ../../.venv/bin/python repair/prepare_partial_workflow.py
    deps:
    - repair/prepare_partial_workflow.py
    - active-groups.json
    - results/partial-recovery-plan.json
    - jobs/x36-density-032/workflow-r1.yaml
    outs:
    - jobs/x36-density-032-r1/workflow.yaml:
        cache: false
    metrics:
    - results/partial-recovery-workflow.json:
        cache: false
  launch_partial_recovery:
    cmd: ../../.venv/bin/python repair/launch_partial.py --execute
    frozen: true
    deps:
    - repair/launch_partial.py
    - results/partial-recovery-workflow.json
    - data/partial-recovery/x36-density-032-r1.xz
    - jobs/x36-density-032-r1/workflow.yaml
    metrics:
    - results/partial-recovery-execution.json:
        cache: false
  collect_partial_recovery:
    cmd: ../../.venv/bin/python repair/collect_partial.py && ../../.venv/bin/python
      repair/collect_partial.py --proof data/late-recovery/x36-density-088-r1/proof.json
      && ../../.venv/bin/python repair/collect_partial.py --proof data/late-recovery/x36-density-093-r1/proof.json
      && ../../.venv/bin/python repair/collect_partial.py --proof data/late-recovery/x36-density-115-r1/proof.json
    deps:
    - repair/collect_partial.py
    - results/partial-recovery-execution.json
    - results/partial-recovery-workflow.json
    - data/late-recovery/x36-density-088-r1/proof.json
    - results/x36-density-088-r1-execution.json
    - data/late-recovery/x36-density-093-r1/proof.json
    - results/x36-density-093-r1-execution.json
    - data/late-recovery/x36-density-115-r1/proof.json
    - results/x36-density-115-r1-execution.json
    outs:
    - data/recovery-collected
    metrics:
    - results/partial-recovery-collection.json:
        cache: false
    - results/x36-density-088-r1-collection.json:
        cache: false
    - results/x36-density-093-r1-collection.json:
        cache: false
    - results/x36-density-115-r1-collection.json:
        cache: false
  prepare_grouped_folds:
    cmd: ../../.venv/bin/python prepare_grouped_folds.py
    deps:
    - prepare_grouped_folds.py
    - cases.json
    - ../35_surrogate_diagnostics/attempt20/schema.json
    outs:
    - data/grouped-folds.json
  prepare_learning_data:
    cmd: ../../.venv/bin/python prepare_learning_data.py
    deps:
    - prepare_learning_data.py
    - cases.json
    - data/grouped-folds.json
    - data/four-state
    - data/verified-material
    - results/four-state-extraction.json
    - ../35_surrogate_diagnostics/attempt20/data/sequences.npz
    - ../35_surrogate_diagnostics/attempt20/schema.json
    - ../35_surrogate_diagnostics/attempt22/data/activity_audit/labels.npz
    - ../35_surrogate_diagnostics/scorecard-v1.json
    outs:
    - data/learning
    - learning-schema.json:
        cache: false
    metrics:
    - results/learning-data.json:
        cache: false
  audit_late_preemptions:
    cmd: ../../.venv/bin/python repair/audit_preemptions.py
    deps:
    - repair/audit_preemptions.py
    - active-groups.json
    - results/input-freeze.json
    - results/terminal-088.json
    - results/terminal-093.json
    - results/terminal-115.json
    outs:
    - data/interrupted/x36-density-088
    - data/interrupted/x36-density-093
    - data/interrupted/x36-density-115
    metrics:
    - results/preemption-088.json:
        cache: false
    - results/preemption-093.json:
        cache: false
    - results/preemption-115.json:
        cache: false
  prepare_late_recovery:
    cmd: ../../.venv/bin/python repair/prepare_late_recovery.py
    deps:
    - repair/prepare_late_recovery.py
    - active-groups.json
    - data/packages
    - results/preemption-088.json
    - results/preemption-093.json
    - results/preemption-115.json
    - jobs/x36-density-088/workflow-r1.yaml
    - jobs/x36-density-093/workflow-r1.yaml
    - jobs/x36-density-115/workflow-r1.yaml
    outs:
    - data/late-recovery
  launch_recovery_088:
    cmd: ../../.venv/bin/python repair/launch_partial.py --execute --proof data/late-recovery/x36-density-088-r1/proof.json
    frozen: true
    deps:
    - repair/launch_partial.py
    - data/late-recovery/x36-density-088-r1
    metrics:
    - results/x36-density-088-r1-execution.json:
        cache: false
  launch_recovery_093:
    cmd: ../../.venv/bin/python repair/launch_partial.py --execute --proof data/late-recovery/x36-density-093-r1/proof.json
    frozen: true
    deps:
    - repair/launch_partial.py
    - data/late-recovery/x36-density-093-r1
    metrics:
    - results/x36-density-093-r1-execution.json:
        cache: false
  launch_recovery_115:
    cmd: ../../.venv/bin/python repair/launch_partial.py --execute --proof data/late-recovery/x36-density-115-r1/proof.json
    frozen: true
    deps:
    - repair/launch_partial.py
    - data/late-recovery/x36-density-115-r1
    metrics:
    - results/x36-density-115-r1-execution.json:
        cache: false
