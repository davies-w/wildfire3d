stages:
  prepare:
    cmd: ../../.venv/bin/python prepare.py && ../../.venv/bin/python validate.py &&
      ../../.venv/bin/python build_pool.py
    deps:
    - prepare.py
    - validate.py
    - build_pool.py
    - model.py
    - gated_model.py
    - worker.py
    - cloud_check.py
    - joint_objective.py
    - ../45_cone_multitask/data/labels
    - ../41_dropout10_from_start/data/training/objective.py
    - ../41_dropout10_from_start/data/training/runtime.py
    - ../41_dropout10_from_start/data/training/schema.json
    - ../41_dropout10_from_start/data/training/data/sequences.npz
    - ../41_dropout10_from_start/data/training/coverage-plan.json
    - ../38_history8_shared64/data/training08/bootstrap.py
    - ../38_history8_shared64/data/training08/workflow.yaml
    outs:
    - data/training
  progress:
    cmd: ../../.venv/bin/python snapshot_progress.py
    deps:
    - snapshot_progress.py
    - plot_learning_curve.py
    outs:
    - data/progress-public
  collect:
    cmd: ../../.venv/bin/python collect.py
    deps:
    - collect.py
    outs:
    - data/pool03-results
  interrupted:
    cmd: ../../.venv/bin/python archive_failed01.py
    frozen: true
    outs:
    - data/interrupted-training
  prepare02:
    cmd: ../../.venv/bin/python prepare02.py
    deps:
    - prepare02.py
    - worker02.py
    - cloud_check02.py
    - build_pool02.py
    outs:
    - data/training02
  prepare03:
    cmd: ../../.venv/bin/python prepare03.py
    deps:
    - prepare03.py
    - build_pool03.py
    - cloud_check03.py
    outs:
    - data/training03
  report:
    cmd: ../../.venv/bin/python analyze.py && ../../.venv/bin/python build_public.py
      && ../../.venv/bin/python build_reports.py
    deps:
    - analyze.py
    - build_public.py
    - build_reports.py
    - plot_case.py
    outs:
    - data/analysis
    - data/public
    - data/report-public
  animations:
    cmd: ../../.venv/bin/python animate_cases.py
    deps:
    - animate_cases.py
    - publish_animations.py
    - data/pool03-results/fold00-test-predictions.npz
    - data/training03/data/cones.npz
    - data/training03/schema.json
    - ../44_hot_gas_cones/extract_training.py
    - ../44_hot_gas_cones/cones.py
    - ../45_cone_multitask/data/labels/schema.json
    - ../36_tree_density/cases.json
    - ../36_tree_density/data/verified-material/x36_0978_s0/x36_0978_s0_1_1.sf
    - ../36_tree_density/data/verified-material/x36_1078_s0/x36_1078_s0_1_1.sf
    outs:
    - data/animations
  pivot_analysis:
    cmd: ../../.venv/bin/python analyze_pivot.py
    deps:
    - analyze_pivot.py
    - data/training03/schema.json
    - data/training03/data/cones.npz
    - data/training03/data/sequences.npz
    outs:
    - data/pivot-analysis
