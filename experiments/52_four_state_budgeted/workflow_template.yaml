main:
  steps:
  - initialize:
      assign:
      - job:
          taskGroups:
          - taskCount: '1'
            parallelism: '1'
            taskCountPerNode: '1'
            taskSpec:
              computeResource:
                cpuMilli: 4000
                memoryMib: 12000
              maxRunDuration: 87300s
              maxRetryCount: 0
              runnables:
              - container:
                  imageUri: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
                  entrypoint: python
                  commands:
                  - -c
                  - BOOTSTRAP_REPLACED_AT_PACKAGING
                  options: --shm-size=1g
          allocationPolicy:
            instances:
            - policy:
                machineType: n1-standard-4
                provisioningModel: SPOT
                bootDisk:
                  sizeGb: '60'
                  type: pd-balanced
                accelerators:
                - type: nvidia-tesla-t4
                  count: 1
              installGpuDrivers: true
            location:
              allowedLocations:
              - zones/us-west1-a
              - zones/us-west1-b
            serviceAccount:
              email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
            labels:
              trial_id: gpu38-history01
            network:
              networkInterfaces:
              - network: projects/tmrw-wildfire-20261015/global/networks/fds-trial
                subnetwork: projects/tmrw-wildfire-20261015/regions/us-west1/subnetworks/fds-timing-west1
          labels:
            trial_id: gpu38-history01
          logsPolicy:
            destination: CLOUD_LOGGING
      - status:
          body:
            status:
              state: UNKNOWN
  - create:
      call: http.post
      args:
        url: https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/us-west1/jobs
        query:
          jobId: fds-gpu38-history01
        auth:
          type: OAuth2
        body: ${job}
      result: created
  - monitor:
      try:
        steps:
        - get_status:
            call: http.get
            args:
              url: https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/us-west1/jobs/fds-gpu38-history01
              auth:
                type: OAuth2
            result: status
        - get_vm_a:
            call: http.get
            args:
              url: https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/us-west1-a/instances
              query:
                filter: labels.trial_id = gpu38-history01
              auth:
                type: OAuth2
            result: active_vms_a
        - get_vm_c:
            call: http.get
            args:
              url: https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/us-west1-b/instances
              query:
                filter: labels.trial_id = gpu38-history01
              auth:
                type: OAuth2
            result: active_vms_c
        - get_vm:
            assign:
            - active_vms:
                body:
                  items: ${default(map.get(active_vms_a.body, "items"), [])}
        - get_vm_append_c:
            for:
              value: pool_vm
              in: ${default(map.get(active_vms_c.body, "items"), [])}
              steps:
              - get_vm_append_vm:
                  assign:
                  - active_vms.body.items: ${list.concat(active_vms.body.items, pool_vm)}
        - reset_age:
            assign:
            - age_expired: false
        - check_vm_age:
            for:
              value: active_vm
              in: ${default(map.get(active_vms.body, "items"), [])}
              steps:
              - age_limit:
                  switch:
                  - condition: ${sys.now() >= time.parse(active_vm.creationTimestamp)
                      + 88200}
                    assign:
                    - age_expired: true
        - check:
            switch:
            - condition: ${status.body.status.state == "SUCCEEDED" or status.body.status.state
                == "FAILED"}
              next: record
            - condition: ${age_expired}
              next: record
        - wait:
            call: sys.sleep
            args:
              seconds: ${if(len(default(map.get(active_vms.body, "items"), [])) ==
                0, 300, 30)}
            next: get_status
      except:
        as: monitor_error
        steps:
        - monitor_failure:
            call: sys.log
            args:
              text: Monitoring failed; proceeding to cleanup
              severity: ERROR
  - record:
      try:
        call: http.post
        args:
          url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
          query:
            uploadType: media
            name: history38/training01/job-status.json
          auth:
            type: OAuth2
          headers:
            Content-Type: application/json
          body: ${status.body}
      except:
        as: record_error
        steps:
        - record_failure:
            call: sys.log
            args:
              text: Could not persist final status; proceeding with cleanup
              severity: ERROR
  - delete_job:
      try:
        call: http.delete
        args:
          url: https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/us-west1/jobs/fds-gpu38-history01
          auth:
            type: OAuth2
        result: deletion
      except:
        as: delete_error
        steps:
        - delete_failure:
            call: sys.log
            args:
              text: Batch deletion failed; checking workers directly
              severity: ERROR
  - cleanup_wait:
      call: sys.sleep
      args:
        seconds: 30
  - list_workers_a:
      call: http.get
      args:
        url: https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/us-west1-a/instances
        query:
          filter: labels.trial_id = gpu38-history01
        auth:
          type: OAuth2
      result: workers_a
  - list_workers_c:
      call: http.get
      args:
        url: https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/us-west1-b/instances
        query:
          filter: labels.trial_id = gpu38-history01
        auth:
          type: OAuth2
      result: workers_c
  - list_workers:
      assign:
      - workers:
          body:
            items: ${default(map.get(workers_a.body, "items"), [])}
  - list_workers_append_c:
      for:
        value: pool_vm
        in: ${default(map.get(workers_c.body, "items"), [])}
        steps:
        - list_workers_append_vm:
            assign:
            - workers.body.items: ${list.concat(workers.body.items, pool_vm)}
  - delete_stragglers:
      for:
        value: vm
        in: ${default(map.get(workers.body, "items"), [])}
        steps:
        - delete_vm:
            try:
              call: http.delete
              args:
                url: ${vm.selfLink}
                auth:
                  type: OAuth2
            except:
              as: cleanup_error
              steps:
              - check_cleanup_error:
                  switch:
                  - condition: ${map.get(cleanup_error, "code") != 404}
                    steps:
                    - rethrow_cleanup:
                        raise: ${cleanup_error}
  - verify_wait:
      call: sys.sleep
      args:
        seconds: 30
  - verify_a:
      call: http.get
      args:
        url: https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/us-west1-a/instances
        query:
          filter: labels.trial_id = gpu38-history01
        auth:
          type: OAuth2
      result: remaining_a
  - verify_c:
      call: http.get
      args:
        url: https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/us-west1-b/instances
        query:
          filter: labels.trial_id = gpu38-history01
        auth:
          type: OAuth2
      result: remaining_c
  - verify:
      assign:
      - remaining:
          body:
            items: ${default(map.get(remaining_a.body, "items"), [])}
  - verify_append_c:
      for:
        value: pool_vm
        in: ${default(map.get(remaining_c.body, "items"), [])}
        steps:
        - verify_append_vm:
            assign:
            - remaining.body.items: ${list.concat(remaining.body.items, pool_vm)}
  - assert_empty:
      switch:
      - condition: ${len(default(map.get(remaining.body, "items"), [])) > 0}
        raise: 'Cleanup incomplete: labeled workers remain'
  - done:
      return:
        mode: domain17
        final_state: ${status.body.status.state}
        workers_remaining: 0
        job_uid: ${created.body.uid}
