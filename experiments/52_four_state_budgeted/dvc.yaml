stages:
  prepare_observations:
    cmd: python prepare_data.py
    deps:
    - prepare_data.py
    - ../51_three_tree_campaign/data/cases.jsonl.gz
    outs:
    - data/observations.npz
    - data/source-schema.json
  freeze_split:
    cmd: python prepare_split.py
    deps:
    - prepare_split.py
    - data/source-schema.json
    outs:
    - data/schema.json
  collect_results:
    cmd: python collect_results.py
    deps:
    - collect_results.py
    - worker.py
    - model.py
    - objective.py
    - data/schema.json
    - coverage-plan.json
    outs:
    - data/results
  verify_final:
    cmd: python verify_final.py
    deps:
    - verify_final.py
    - objective.py
    - data/schema.json
    - data/observations.npz
    - data/results
    outs:
    - final-verification.json:
        cache: false
  build_gallery:
    cmd: python build_gallery.py
    deps:
    - build_gallery.py
    - gallery-template.html
    - data/observations.npz
    - data/schema.json
    - data/results/fold00-test-predictions.npz
    outs:
    - data/test-gallery
