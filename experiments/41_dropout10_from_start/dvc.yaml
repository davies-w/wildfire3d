stages:
  prepare:
    cmd: ../../.venv/bin/python prepare.py && ../../.venv/bin/python build_pool.py
    deps:
    - prepare.py
    - build_pool.py
    - worker.py
    - cloud_check.py
    - ../40_dropout10_continuation/data/training02
    - ../38_history8_shared64/data/training08/bootstrap.py
    - ../38_history8_shared64/data/training08/workflow.yaml
    outs:
    - data/training:
        persist: true
  progress:
    cmd: ../../.venv/bin/python snapshot_progress.py
    deps:
    - snapshot_progress.py
    - plot_learning_curve.py
    outs:
    - data/progress-public:
        persist: true
  preserve:
    cmd: ../../.venv/bin/python preserve.py
    deps:
    - preserve.py
    outs:
    - data/provenance:
        persist: true
  collect:
    cmd: ../../.venv/bin/python collect.py
    deps:
    - collect.py
    outs:
    - data/pool01-results:
        persist: true
  analysis:
    cmd: ../../.venv/bin/python analyze.py
    deps:
    - analyze.py
    - data/pool01-results
    - data/training/data/sequences.npz
    - data/training/schema.json
    outs:
    - data/analysis:
        persist: true
  public:
    cmd: ../../.venv/bin/python build_public.py
    deps:
    - build_public.py
    - data/analysis
    - data/training/schema.json
    outs:
    - data/public:
        persist: true
  reports:
    cmd: ../../.venv/bin/python build_reports.py
    deps:
    - build_reports.py
    - data/analysis
    - data/public
    - ../39_long_window_continuation/data/analysis
    - ../40_dropout10_continuation/data/analysis
    outs:
    - data/report-public:
        persist: true
