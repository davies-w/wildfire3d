stages:
  prepare:
    cmd: ../../.venv/bin/python prepare.py
    deps:
    - prepare.py
    - ../47_tree_archetypes/data/geometry.json
    outs:
    - data/cases.jsonl.gz
    - data/geometries.json
    - data/design.json
  pilot:
    cmd: ../../.venv/bin/python prepare_pilot.py
    deps:
    - prepare_pilot.py
    - data/cases.jsonl.gz
    - data/geometries.json
    - ../36_tree_density/base-input.fds
    outs:
    - data/pilot
  cloud_inputs:
    cmd: ../../.venv/bin/python package_cloud.py
    frozen: true
    outs:
    - data/cloud
    - data/cloud-context
