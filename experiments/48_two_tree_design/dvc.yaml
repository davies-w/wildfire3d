stages:
  prepare:
    cmd: ../../.venv/bin/python prepare.py
    deps:
    - prepare.py
    - ../47_tree_archetypes/data/geometry.json
    outs:
    - data/cases.jsonl.gz
    - data/geometries.json
    - data/design.json
  pilot:
    cmd: ../../.venv/bin/python prepare_pilot.py
    deps:
    - prepare_pilot.py
    - data/cases.jsonl.gz
    - data/geometries.json
    - ../36_tree_density/base-input.fds
    outs:
    - data/pilot
  cloud_inputs:
    cmd: ../../.venv/bin/python package_cloud.py
    frozen: true
    outs:
    - data/cloud
    - data/cloud-context
  cloud_inputs02:
    cmd: ../../.venv/bin/python package_cloud02.py
    frozen: true
    outs:
    - data/cloud02
  cloud_inputs03:
    cmd: ../../.venv/bin/python package_cloud03.py
    frozen: true
    outs:
    - data/cloud03
  cloud_inputs04:
    cmd: ../../.venv/bin/python package_cloud04.py
    frozen: true
    outs:
    - data/cloud04
  startup03_audit:
    cmd: ../../.venv/bin/python verify_mass03.py
    frozen: true
    outs:
    - data/startup03
  cloud_inputs05:
    cmd: ../../.venv/bin/python package_cloud05.py
    frozen: true
    outs:
    - data/cloud05
  canaries04:
    cmd: ../../.venv/bin/python verify_canaries04.py
    frozen: true
    outs:
    - data/canaries04
  stopcheck01:
    cmd: ../../.venv/bin/python prepare_stopcheck01.py
    frozen: true
    outs:
    - data/stopcheck01
