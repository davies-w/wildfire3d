# Experiment 08: one ember on a fuel bed, away from any fire.
#
# `dvc repro` runs this file; `dvc.lock` is committed.  Outputs are tracked
# where FDS writes them; the .s3d volumes are uncached, so DVC knows this stage
# produces them without ever copying or pushing them.
stages:
  solve:
    wdir: ../..
    cmd: >-
      python3 scripts/run_fds.py experiments/08_isolated_ember_ignition/ember_test.fds --threads 4
      && python3 scripts/strip_terrain.py FDS/cases/ember_test ember_test
    deps:
      - experiments/08_isolated_ember_ignition/ember_test.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - FDS/cases/ember_test/ember_test_1.prt5
      - FDS/cases/ember_test/ember_test_1_1.bf
      - FDS/cases/ember_test/ember_test_1_2.bf
      - FDS/cases/ember_test/ember_test_1_1.sf
      - FDS/cases/ember_test/ember_test_1_2.sf
      - FDS/cases/ember_test/ember_test.smv
      - FDS/cases/ember_test/ember_test_1_1.s3d:
          cache: false
      - FDS/cases/ember_test/ember_test_1_2.s3d:
          cache: false
      - FDS/cases/ember_test/ember_test_1_3.s3d:
          cache: false
