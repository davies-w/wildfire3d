    cmd: ../../.venv/bin/python summarize_contact.py
    deps:
    - summarize_contact.py
    - contact_ignition.py
    - data/contact/contact_ring20
    - data/contact/contact_ring20_bare
    - ../../FDS/install/bin/fds2ascii
    outs:
    - data/contact_boundary
    - results/contact-ignition.json:
        cache: false
    - results/contact-ignition.png
