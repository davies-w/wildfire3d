stages:
  decks:
    cmd: ../../.venv/bin/python scene.py
    deps:
    - scene.py
    - inputs
    outs:
    - wave1.json:
        cache: false
  geometry:
    cmd: ../../.venv/bin/python geometry_report.py
    deps:
    - geometry_report.py
    - scene.py
    - ../14_ignition_surrogate/data/scenes/sebastopol_10/geometry.npz
    - ../14_ignition_surrogate/data/scenes/sebastopol_11/geometry.npz
    - ../14_ignition_surrogate/results/properties.json
    outs:
    - results/geometry-context.png
    - results/geometry-report.json:
        cache: false
  preflight:
    cmd: ../../.venv/bin/python preflight.py
    deps:
    - preflight.py
    - scene.py
    - inputs
    - ../../FDS/src/fds/Build/ompi_gnu_osx/fds_ompi_gnu_osx
    outs:
    - data/preflight
    - results/preflight.json:
        cache: false
  collect:
    cmd: ../../.venv/bin/python control.py fetch
    deps:
    - control.py
    - budget.json
    outs:
    - data/cloud
    - data/downloads
    - results/cleanup.json:
        cache: false
  summarize:
    cmd: ../../.venv/bin/python summarize_stage_a.py
    deps:
    - summarize_stage_a.py
    - finish_stage_a.py
    - data/cloud
    - comparison-pairs.json
    outs:
    - data/boundary
    - results/stage-a.json:
        cache: false
  component_images:
    cmd: ../../.venv/bin/python render_components.py
    deps:
    - render_components.py
    - decks
    - data/cloud
    outs:
    - results/component_images
  vegetation_diagnosis:
    cmd: ../../.venv/bin/python diagnose_vegetation.py
    deps:
    - diagnose_vegetation.py
    - data/cloud
    outs:
    - results/vegetation-diagnosis.json:
        cache: false
  canopy_heating_diagnosis:
    cmd: ../../.venv/bin/python diagnose_canopy_heating.py
    deps:
    - diagnose_canopy_heating.py
    - data/cloud
    - ../../FDS/install/bin/fds2ascii
    outs:
    - data/canopy_diagnosis
    - results/canopy-heating-diagnosis.json:
        cache: false
    - results/canopy-plume-diagnosis.png
  upwind_prepare:
    cmd: ../../.venv/bin/python upwind_test.py prepare
    deps:
    - upwind_test.py
    - control.py
    - decks/a21_single.fds
    - data/cloud/a21_single/result.json
    - jobs/a21_single/workflow.yaml
    outs:
    - data/upwind_preflight
    - results/upwind-preflight.json:
        cache: false
    - decks/a21_single_upstream.fds:
        cache: false
  upwind_assess:
    cmd: ../../.venv/bin/python finish_upwind.py
    deps:
    - finish_upwind.py
    - upwind_test.py
    - data/cloud/a21_single_upstream
    outs:
    - results/upwind-result.json:
        cache: false
  contact_canopy:
    cmd: ../../.venv/bin/python contact_ignition.py contact_ring20 90
    deps:
    - contact_ignition.py
    - decks/a21_single_upstream.fds
    - ../../FDS/src/fds/Build/ompi_gnu_osx/fds_ompi_gnu_osx
    outs:
    - data/contact/contact_ring20
  contact_control:
    cmd: ../../.venv/bin/python -c "from contact_ignition import run; run('contact_ring20_bare',
      bare=True)"
    deps:
    - contact_ignition.py
    - decks/a21_single_upstream.fds
    - ../../FDS/src/fds/Build/ompi_gnu_osx/fds_ompi_gnu_osx
    outs:
    - data/contact/contact_ring20_bare
