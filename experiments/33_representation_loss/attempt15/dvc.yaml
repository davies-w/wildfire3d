stages:
  package:
    cmd: ../../../.venv/bin/python validate.py && ../../../.venv/bin/python prepare_pilot.py
    deps:
    - worker.py
    - coverage-plan.json
    - deterministic_interpolation.py
    - validate_interpolation.py
    - original_cnn.py
    - worker_base.py
    - matched_losses.py
    - baseline_losses.py
    - models.py
    - losses.py
    - prepare_pilot.py
    - validate.py
    - cases.json
    - groups.json
    - data/resume
    - data/geometries.npz
    - data/initial_snapshot.pt
    - physical_background_losses.py
    - previous_loss.py
    outs:
    - data/pilot-overlay.tar
    - results/input-freeze.json:
        cache: false
    - results/preflight.json:
        cache: false
    - gpu-workflow.yaml:
        cache: false
  cloud_submit:
    cmd: ../../../.venv/bin/python launch.py
    frozen: false
    deps:
    - launch.py
    - cloud.py
    - gpu-workflow.yaml
    - data/pilot-overlay.tar
    metrics:
    - results/execution.json:
        cache: false
  cloud_collect:
    cmd: ../../../.venv/bin/python collect.py
    deps:
    - collect.py
    - cloud.py
    - results/execution.json
    outs:
    - data/collected
    metrics:
    - results/cleanup.json:
        cache: false
    - results/permission-removed.json:
        cache: false
  resume_inputs:
    cmd: ../../../.venv/bin/python restore_inputs.py
    deps:
    - restore_inputs.py
    - ../attempt14/data/collected/expand360-checkpoint-12000.pt
    outs:
    - data/resume
  coverage_inputs:
    cmd: ../../../.venv/bin/python setup_coverage.py
    deps:
    - setup_coverage.py
    - ../attempt14/results/coverage-summary.json
    - ../../32_tree_expansion/development.json
    - ../../32_tree_expansion/groups.json
    - ../../32_tree_expansion/data/geometries.npz
    outs:
    - cases.json:
        cache: false
    - groups.json:
        cache: false
    - coverage-plan.json:
        cache: false
    - data/geometries.npz
  matched_analysis:
    cmd: ../../../.venv/bin/python analyze.py
    deps:
    - analyze.py
    - data/collected
    metrics:
    - results/comparison.json:
        cache: false
  render_projections:
    cmd: ../../../.venv/bin/python render_projections.py
    deps:
    - render_projections.py
    - coverage-plan.json
    - cases.json
    - data/collected
    outs:
    - data/visuals
