stages:
  package:
    cmd: ../../../.venv/bin/python validate.py && ../../../.venv/bin/python prepare_pilot.py
    deps:
    - worker.py
    - evaluation-plan.json
    - deterministic_interpolation.py
    - validate_interpolation.py
    - original_cnn.py
    - worker_base.py
    - matched_losses.py
    - baseline_losses.py
    - models.py
    - losses.py
    - prepare_pilot.py
    - validate.py
    - cases.json
    - groups.json
    - data/resume
    - data/geometries.npz
    - data/initial_snapshot.pt
    outs:
    - data/pilot-overlay.tar
    - results/input-freeze.json:
        cache: false
    - results/preflight.json:
        cache: false
    - gpu-workflow.yaml:
        cache: false
  cloud_submit:
    cmd: ../../../.venv/bin/python launch.py
    frozen: false
    deps:
    - launch.py
    - cloud.py
    - gpu-workflow.yaml
    - data/pilot-overlay.tar
    metrics:
    - results/execution.json:
        cache: false
  cloud_collect:
    cmd: ../../../.venv/bin/python collect.py
    deps:
    - collect.py
    - cloud.py
    - results/execution.json
    outs:
    - data/collected
    metrics:
    - results/cleanup.json:
        cache: false
    - results/permission-removed.json:
        cache: false
  resume_inputs:
    cmd: ../../../.venv/bin/python restore_inputs.py
    deps:
    - restore_inputs.py
    - ../attempt11/data/resume/current.pt
    - ../attempt11/data/collected/control-checkpoint-2500.pt
    - ../attempt11/data/collected/dose_background-checkpoint-2500.pt
    - ../attempt11/data/collected/physical_low-checkpoint-2500.pt
    outs:
    - data/resume
  broader_analysis:
    cmd: ../../../.venv/bin/python analyze_broader.py
    deps:
    - analyze_broader.py
    - pilot-cases.json
    - data/collected
    metrics:
    - results/broader-summary.json:
        cache: false
  render_projections:
    cmd: ../../../.venv/bin/python render_projections.py
    deps:
    - render_projections.py
    - evaluation-plan.json
    - cases.json
    - data/collected/projections.npz
    outs:
    - data/visuals
