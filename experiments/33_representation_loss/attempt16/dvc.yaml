stages:
  package:
    cmd: ../../../.venv/bin/python validate.py && ../../../.venv/bin/python prepare_pilot.py
    deps:
    - worker.py
    - coverage-plan.json
    - deterministic_interpolation.py
    - validate_interpolation.py
    - original_cnn.py
    - worker_base.py
    - matched_losses.py
    - baseline_losses.py
    - models.py
    - losses.py
    - prepare_pilot.py
    - validate.py
    - cases.json
    - groups.json
    - data/resume
    - data/geometries.npz
    - data/initial_snapshot.pt
    - physical_background_losses.py
    - previous_loss.py
    outs:
    - data/pilot-overlay.tar
    - results/input-freeze.json:
        cache: false
    - results/preflight.json:
        cache: false
    - gpu-workflow.yaml:
        cache: false
  cloud_submit:
    cmd: ../../../.venv/bin/python launch.py
    frozen: false
    deps:
    - launch.py
    - cloud.py
    - gpu-workflow.yaml
    - data/pilot-overlay.tar
    metrics:
    - results/execution.json:
        cache: false
  cloud_collect:
    cmd: ../../../.venv/bin/python collect.py
    deps:
    - collect.py
    - cloud.py
    - results/execution.json
    outs:
    - data/collected
    metrics:
    - results/cleanup.json:
        cache: false
    - results/permission-removed.json:
        cache: false
  learning_curves:
    cmd: ../../../.venv/bin/python analyze_curves.py
    deps:
    - analyze_curves.py
    - data/collected
    metrics:
    - results/curves.json:
        cache: false
    outs:
    - data/visuals
  audit_curves:
    cmd: ../../../.venv/bin/python audit_curves.py
    deps:
    - audit_curves.py
    - coverage-plan.json
    - data/collected
    metrics:
    - results/curve-audit.json:
        cache: false
