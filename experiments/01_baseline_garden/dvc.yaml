# Experiment 01: baseline garden fire with a house.
#
# `dvc repro` runs this file; `dvc.lock` is committed.  Outputs are tracked
# where FDS writes them.  The .s3d volumes are uncached: DVC knows this stage
# produces them and will re-solve when they are missing, but never copies or
# pushes them.
stages:
  solve:
    wdir: ../..
    cmd: >-
      python3 scripts/run_fds.py experiments/01_baseline_garden/garden_house.fds --threads 4
      && python3 scripts/strip_terrain.py FDS/cases/garden_house garden_house
    deps:
      - experiments/01_baseline_garden/garden_house.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - FDS/cases/garden_house/garden_house_1.prt5
      - FDS/cases/garden_house/garden_house_1_1.bf
      - FDS/cases/garden_house/garden_house_1_2.bf
      - FDS/cases/garden_house/garden_house_1_1.sf
      - FDS/cases/garden_house/garden_house_1_2.sf
      - FDS/cases/garden_house/garden_house.smv
      - FDS/cases/garden_house/garden_house_1_1.s3d:
          cache: false
      - FDS/cases/garden_house/garden_house_1_2.s3d:
          cache: false
      - FDS/cases/garden_house/garden_house_1_3.s3d:
          cache: false
