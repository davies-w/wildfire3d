# Experiment 04: fence line and six trees in a larger domain.
#
# `dvc repro` runs this file; `dvc.lock` is committed.  Outputs are tracked
# where FDS writes them; the .s3d volumes are uncached, so DVC knows this stage
# produces them without ever copying or pushing them.
stages:
  solve:
    wdir: ../..
    cmd: >-
      .venv/bin/python scripts/run_fds.py experiments/04_fence_and_trees_large/garden_tall.fds --threads 4
      && .venv/bin/python scripts/strip_terrain.py FDS/cases/garden_tall garden_tall
    deps:
      - experiments/04_fence_and_trees_large/garden_tall.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - FDS/cases/garden_tall/garden_tall_1.prt5
      - FDS/cases/garden_tall/garden_tall_1_1.bf
      - FDS/cases/garden_tall/garden_tall_1_2.bf
      - FDS/cases/garden_tall/garden_tall_1_1.sf
      - FDS/cases/garden_tall/garden_tall_1_2.sf
      - FDS/cases/garden_tall/garden_tall.smv
      - FDS/cases/garden_tall/garden_tall_1_1.s3d:
          cache: false
      - FDS/cases/garden_tall/garden_tall_1_2.s3d:
          cache: false
      - FDS/cases/garden_tall/garden_tall_1_3.s3d:
          cache: false
