stages:
  prepare01:
    cmd: python prepare01.py
    deps:
    - prepare01.py
    - adapt_architecture.py
    - cloud_check01.py
    - ../37_integral_objective/data/training03
    - ../37_integral_objective/results03/package.json
    - ../36_tree_density/data/model-training/schema.json
    outs:
    - data/training01:
        persist: true
  validate01:
    cmd: python validate01.py
    deps:
    - validate01.py
    - data/training01
    outs:
    - results01/offline-check.json
  audit_startup01:
    cmd: python audit_startup01.py
    deps:
    - audit_startup01.py
    outs:
    - data/startup-audit01
  collect01:
    cmd: python collect01.py
    deps:
    - collect01.py
    outs:
    - data/training01-results:
        persist: true
  preserve01:
    cmd: python preserve01.py
    deps:
    - preserve01.py
    outs:
    - data/provenance01
  archive_preemption01:
    cmd: python archive_preemption01.py
    deps:
    - archive_preemption01.py
    outs:
    - data/preempted01:
        persist: true
  prepare02:
    cmd: python prepare02.py
    deps:
    - prepare02.py
    - cloud_check02.py
    - data/training01
    - data/preempted01
    outs:
    - data/training02:
        persist: true
  validate02:
    cmd: python validate02.py
    deps:
    - validate02.py
    - data/training02
    outs:
    - results02/offline-check.json
  audit_startup02:
    cmd: python audit_startup02.py
    deps:
    - audit_startup02.py
    outs:
    - data/startup-audit02
  collect02:
    cmd: python collect02.py
    deps:
    - collect02.py
    outs:
    - data/training02-results:
        persist: true
