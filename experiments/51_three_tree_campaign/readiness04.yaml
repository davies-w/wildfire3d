main:
  steps:
  - init:
      assign:
      - candidates:
        - id: wave-000
          job_id: fds-tree51-campaign04-wave-000
          label: tree51-campaign04-wave-000
          region: us-central1
          zones:
          - us-central1-a
          - us-central1-b
          - us-central1-c
          job:
            taskGroups:
            - taskCount: '18'
              parallelism: '2'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 28000
                maxRunDuration: 10800s
                maxRetryCount: 0
                environment:
                  variables: {}
                runnables:
                - container:
                    imageUri: us-central1-docker.pkg.dev/tmrw-wildfire-20261015/fds/solver48@sha256:2f27d44c854922f94f96a0c4137e1b092931022cf4294e1f89f888a56fd76443
                    entrypoint: python3
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --cpus=4 --memory=28000m --pids-limit=256
            allocationPolicy:
              instances:
              - policy:
                  machineType: c3-highmem-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '30'
                    type: pd-balanced
              location:
                allowedLocations:
                - zones/us-central1-a
                - zones/us-central1-b
                - zones/us-central1-c
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: tree51-campaign04-canary
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/fds-trial
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-central1/subnetworks/fds-trial
            labels:
              trial_id: tree51-campaign04-canary
            logsPolicy:
              destination: CLOUD_LOGGING
  - read_admission:
      call: http.get
      args:
        url: https://storage.googleapis.com/storage/v1/b/tmrw-wildfire-20261015-trial/o/tree51%2Fcampaign04%2Fcontrol%2Fadmission-v4.json
        query:
          alt: media
        auth:
          type: OAuth2
      result: admission
  - admission_guard:
      switch:
      - condition: ${admission.body.passed != true}
        raise: Budget admission missing
  - read_manifest:
      call: http.get
      args:
        url: https://storage.googleapis.com/storage/v1/b/tmrw-wildfire-20261015-trial/o/tree51%2Fcampaign04%2Finputs%2Fmanifest.json
        query:
          alt: media
        auth:
          type: OAuth2
      result: manifest
  - manifest_shape:
      switch:
      - condition: ${len(manifest.body) != 103 or manifest.body[0].count != 1}
        raise: Unexpected frozen manifest shape
  - task_list_access:
      try:
        call: http.get
        args:
          url: https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/us-central1/jobs/fds-tree51-campaign04-access-check/taskGroups/group0/tasks
          auth:
            type: OAuth2
          query:
            pageSize: 1
      except:
        as: e
        steps:
        - expected_missing:
            switch:
            - condition: ${map.get(e,"code") != 404}
              raise: ${e}
  - write_probe1:
      call: http.post
      args:
        url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
        auth:
          type: OAuth2
        query:
          uploadType: media
          name: ${"tree51/campaign04/readiness-status." + string(sys.now())}
          ifGenerationMatch: 0
        headers:
          Content-Type: application/json
        body:
          passed: true
  - write_probe2:
      call: http.post
      args:
        url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
        auth:
          type: OAuth2
        query:
          uploadType: media
          name: ${"tree51/campaign04/readiness-status." + string(sys.now())}
          ifGenerationMatch: 0
        headers:
          Content-Type: application/json
        body:
          passed: true
  - quota_probe:
      call: await_quota
      args:
        c:
          id: wave-000
          job_id: fds-tree51-campaign04-wave-000
          label: tree51-campaign04-wave-000
          region: us-central1
          zones:
          - us-central1-a
          - us-central1-b
          - us-central1-c
          job:
            taskGroups:
            - taskCount: '18'
              parallelism: '2'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 28000
                maxRunDuration: 10800s
                maxRetryCount: 0
                environment:
                  variables: {}
                runnables:
                - container:
                    imageUri: us-central1-docker.pkg.dev/tmrw-wildfire-20261015/fds/solver48@sha256:2f27d44c854922f94f96a0c4137e1b092931022cf4294e1f89f888a56fd76443
                    entrypoint: python3
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --cpus=4 --memory=28000m --pids-limit=256
            allocationPolicy:
              instances:
              - policy:
                  machineType: c3-highmem-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '30'
                    type: pd-balanced
              location:
                allowedLocations:
                - zones/us-central1-a
                - zones/us-central1-b
                - zones/us-central1-c
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: tree51-campaign04-canary
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/fds-trial
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-central1/subnetworks/fds-trial
            labels:
              trial_id: tree51-campaign04-canary
            logsPolicy:
              destination: CLOUD_LOGGING
  - check:
      for:
        value: c
        in: ${candidates}
        steps:
        - inspect:
            call: inventory
            args:
              c: ${c}
            result: inv
        - empty:
            switch:
            - condition: ${len(inv.vms)>0 or len(inv.disks)>0}
              raise: Existing pilot resources
  - child_permission_probe:
      call: http.post
      args:
        url: https://workflowexecutions.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/us-central1/workflows/fds-tree51-campaign04-wave/executions
        auth:
          type: OAuth2
        body:
          argument: '{"wave_id": "wave-008", "spent": 0, "checkpoint_seconds": 480,
            "dry_run": true}'
      result: probe_child
  - done:
      return:
        passed: true
        child_execution: ${probe_child.body.name}
inventory:
  params:
  - c
  steps:
  - init:
      assign:
      - vms: []
      - disks: []
  - zones:
      for:
        value: z
        in: ${c.zones}
        steps:
        - get_vms:
            try:
              call: http.get
              args:
                url: ${"https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/"
                  + z + "/instances"}
                auth:
                  type: OAuth2
                query:
                  filter: ${"labels.trial_id = " + c.label}
                  fields: items(name,selfLink,creationTimestamp,status),nextPageToken
                  maxResults: 500
              result: v
            retry: ${http.default_retry}
        - page_guard_v:
            switch:
            - condition: ${map.get(v.body,"nextPageToken") != null}
              raise: Unexpected inventory pagination; refuse partial inventory
            - condition: ${len(default(map.get(v.body,"items"),[])) > 18}
              raise: Unexpected resource count; audit required
        - append_vms:
            for:
              value: vm
              in: ${default(map.get(v.body,"items"),[])}
              steps:
              - add_vm:
                  assign:
                  - vms: ${list.concat(vms,vm)}
        - get_disks:
            try:
              call: http.get
              args:
                url: ${"https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/"
                  + z + "/disks"}
                auth:
                  type: OAuth2
                query:
                  filter: name eq fds-tree51-campa.*
                  fields: items(name,selfLink,users),nextPageToken
                  maxResults: 500
              result: d
            retry: ${http.default_retry}
        - page_guard_d:
            switch:
            - condition: ${map.get(d.body,"nextPageToken") != null}
              raise: Unexpected inventory pagination; refuse partial inventory
            - condition: ${len(default(map.get(d.body,"items"),[])) > 18}
              raise: Unexpected resource count; audit required
        - append_disks:
            for:
              value: disk
              in: ${default(map.get(d.body,"items"),[])}
              steps:
              - add_disk:
                  assign:
                  - disks: ${list.concat(disks,disk)}
  - done:
      return:
        vms: ${vms}
        disks: ${disks}
await_quota:
  params:
  - c
  steps:
  - get:
      try:
        call: http.get
        args:
          url: https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/regions/us-central1
          auth:
            type: OAuth2
        result: q
      retry: ${http.default_retry}
  - reset:
      assign:
      - available: 0
  - quotas:
      for:
        value: item
        in: ${q.body.quotas}
        steps:
        - spot:
            switch:
            - condition: ${item.metric == "PREEMPTIBLE_CPUS"}
              assign:
              - available: ${item.limit-item.usage}
  - ready:
      switch:
      - condition: ${available >= 4 * int(c.job.taskGroups[0].taskCount)}
        return: true
      next: quota_denied
  - quota_denied:
      raise: Insufficient Spot CPU quota; no job submitted
