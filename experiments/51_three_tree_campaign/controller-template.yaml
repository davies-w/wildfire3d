main:
  steps:
  - init:
      assign:
      - candidates: []
      - checkpoint_seconds: 480
  - unpackaged_guard:
      raise: 'UNPACKAGED: frozen cases, budget admission and preservation proof required'
  - campaign:
      try:
        steps:
        - initialize_policy:
            call: initialize_checkpoint_control
        - waves:
            for:
              value: c
              in: ${candidates}
              steps:
              - quota_gate:
                  call: await_quota
                  args:
                    c: ${c}
              - create:
                  call: http.post
                  args:
                    url: https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/us-central1/jobs
                    auth:
                      type: OAuth2
                    query:
                      jobId: ${c.job_id}
                    body: ${c.job}
              - set_deadline:
                  assign:
                  - deadline: ${sys.now()+14400}
              - get:
                  try:
                    call: http.get
                    args:
                      url: ${"https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/"
                        + c.region + "/jobs/" + c.job_id}
                      auth:
                        type: OAuth2
                      query:
                        fields: name,status(state,taskGroups,runDuration)
                    result: state
                  retry: ${http.default_retry}
              - record_state:
                  call: http.post
                  args:
                    url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
                    auth:
                      type: OAuth2
                    query:
                      uploadType: media
                      name: ${"tree51/campaign01/"+c.id+"/job-status.json" + "." +
                        string(sys.now())}
                      ifGenerationMatch: 0
                    headers:
                      Content-Type: application/json
                    body: ${state.body}
              - adapt_checkpoint_interval:
                  call: adapt_checkpoints
                  args:
                    c: ${c}
                    previous: ${checkpoint_seconds}
                  result: checkpoint_seconds
              - terminal:
                  switch:
                  - condition: ${state.body.status.state == "SUCCEEDED"}
                    next: clean_success
                  - condition: ${state.body.status.state == "FAILED"}
                    raise: Pilot worker failed; bulk wave is blocked
              - inv:
                  call: inventory
                  args:
                    c: ${c}
                  result: inv
              - check_age:
                  for:
                    value: vm
                    in: ${inv.vms}
                    steps:
                    - limit:
                        switch:
                        - condition: ${sys.now() > time.parse(vm.creationTimestamp)+11100}
                          raise: Worker VM lifetime exceeded
              - controller_limit:
                  switch:
                  - condition: ${sys.now()>deadline}
                    raise: Queue/run deadline exceeded
              - wait:
                  call: sys.sleep
                  args:
                    seconds: 30
                  next: get
              - clean_success:
                  call: cleanup
                  args:
                    c: ${c}
      except:
        as: failure
        steps:
        - cleanup_all:
            for:
              value: c
              in: ${candidates}
              steps:
              - clean_failed:
                  call: cleanup
                  args:
                    c: ${c}
        - record_failure:
            call: http.post
            args:
              url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
              auth:
                type: OAuth2
              query:
                uploadType: media
                name: ${"tree51/campaign01/controller-error.json." + string(sys.now())}
                ifGenerationMatch: 0
              headers:
                Content-Type: application/json
              body: ${failure}
        - raise_failure:
            raise: ${failure}
  - done:
      return:
        passed: true
        cases: 2000
        cleanup_verified: true
        reused_cases: 22
inventory:
  params:
  - c
  steps:
  - init:
      assign:
      - vms: []
      - disks: []
  - zones:
      for:
        value: z
        in: ${c.zones}
        steps:
        - get_vms:
            try:
              call: http.get
              args:
                url: ${"https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/"
                  + z + "/instances"}
                auth:
                  type: OAuth2
                query:
                  filter: ${"labels.trial_id = " + c.label}
                  fields: items(name,selfLink,creationTimestamp,status),nextPageToken
                  maxResults: 500
              result: v
            retry: ${http.default_retry}
        - page_guard_v:
            switch:
            - condition: ${map.get(v.body,"nextPageToken") != null}
              raise: Unexpected inventory pagination; refuse partial inventory
        - append_vms:
            for:
              value: vm
              in: ${default(map.get(v.body,"items"),[])}
              steps:
              - add_vm:
                  assign:
                  - vms: ${list.concat(vms,vm)}
        - get_disks:
            try:
              call: http.get
              args:
                url: ${"https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/"
                  + z + "/disks"}
                auth:
                  type: OAuth2
                query:
                  filter: name eq fds-tree51-campa.*
                  fields: items(name,selfLink,users),nextPageToken
                  maxResults: 500
              result: d
            retry: ${http.default_retry}
        - page_guard_d:
            switch:
            - condition: ${map.get(d.body,"nextPageToken") != null}
              raise: Unexpected inventory pagination; refuse partial inventory
        - append_disks:
            for:
              value: disk
              in: ${default(map.get(d.body,"items"),[])}
              steps:
              - add_disk:
                  assign:
                  - disks: ${list.concat(disks,disk)}
  - done:
      return:
        vms: ${vms}
        disks: ${disks}
cleanup:
  params:
  - c
  steps:
  - delete_job:
      try:
        call: http.delete
        args:
          url: ${"https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/"
            + c.region + "/jobs/" + c.job_id}
          auth:
            type: OAuth2
      retry: ${http.default_retry}
      except:
        as: err
        steps:
        - unexpected_1:
            switch:
            - condition: ${map.get(err,"code") != 404}
              raise: ${err}
  - inventory:
      call: inventory
      args:
        c: ${c}
      result: inv
  - delete_vms:
      for:
        value: vm
        in: ${inv.vms}
        steps:
        - delete_vm:
            try:
              call: http.delete
              args:
                url: ${vm.selfLink}
                auth:
                  type: OAuth2
            retry: ${http.default_retry}
            except:
              as: err
              steps:
              - unexpected_2:
                  switch:
                  - condition: ${map.get(err,"code") != 404}
                    raise: ${err}
  - wait:
      call: sys.sleep
      args:
        seconds: 15
  - verify:
      call: inventory
      args:
        c: ${c}
      result: left
  - orphan_disks:
      for:
        value: disk
        in: ${left.disks}
        steps:
        - unused:
            switch:
            - condition: ${len(default(map.get(disk,"users"),[])) == 0}
              steps:
              - delete_disk:
                  try:
                    call: http.delete
                    args:
                      url: ${disk.selfLink}
                      auth:
                        type: OAuth2
                  retry: ${http.default_retry}
  - empty:
      switch:
      - condition: ${len(left.vms) > 0 or len(left.disks) > 0}
        next: wait
  - job_present:
      assign:
      - present: true
  - verify_job:
      try:
        call: http.get
        args:
          url: ${"https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/"
            + c.region + "/jobs/" + c.job_id}
          auth:
            type: OAuth2
          query:
            fields: name,status(state,taskGroups,runDuration)
        result: remaining
      retry: ${http.default_retry}
      except:
        as: e
        steps:
        - gone:
            switch:
            - condition: ${map.get(e,"code") == 404}
              assign:
              - present: false
            - condition: ${true}
              raise: ${e}
  - job_wait:
      switch:
      - condition: ${present}
        next: wait
  - done:
      return:
        empty: true
await_quota:
  params:
  - c
  steps:
  - init:
      assign:
      - deadline: ${sys.now()+14400}
  - canary:
      switch:
      - condition: ${c.id == "canary"}
        return: true
  - get:
      try:
        call: http.get
        args:
          url: https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/regions/us-central1
          auth:
            type: OAuth2
        result: q
      retry: ${http.default_retry}
  - reset:
      assign:
      - available: 0
  - quotas:
      for:
        value: item
        in: ${q.body.quotas}
        steps:
        - spot:
            switch:
            - condition: ${item.metric == "PREEMPTIBLE_CPUS"}
              assign:
              - available: ${item.limit-item.usage}
  - ready:
      switch:
      - condition: ${available >= 32}
        return: true
      - condition: ${sys.now()>deadline}
        raise: Spot CPU quota not granted within six hours; no bulk workers launched
  - wait:
      call: sys.sleep
      args:
        seconds: 60
      next: get
adapt_checkpoints:
  params:
  - c
  - previous
  steps:
  - init:
      assign:
      - started: 0
      - evicted: 0
      - page: ''
      - seconds: ${previous}
  - read_tasks:
      try:
        call: http.get
        args:
          url: ${"https://batch.googleapis.com/v1/projects/tmrw-wildfire-20261015/locations/"+c.region+"/jobs/"+c.job_id+"/taskGroups/group0/tasks"}
          auth:
            type: OAuth2
          query:
            pageSize: 100
            pageToken: ${page}
            fields: tasks(name,status(state,statusEvents(taskExecution(exitCode)))),nextPageToken
        result: tasks
      retry: ${http.default_retry}
  - count_tasks:
      for:
        value: task
        in: ${default(map.get(tasks.body,"tasks"),[])}
        steps:
        - started_task:
            switch:
            - condition: ${task.status.state == "RUNNING" or task.status.state ==
                "SUCCEEDED" or task.status.state == "FAILED"}
              assign:
              - started: ${started+1}
        - clear_flag:
            assign:
            - preempted: false
        - events:
            for:
              value: event
              in: ${default(map.get(task.status,"statusEvents"),[])}
              steps:
              - confirmed:
                  switch:
                  - condition: ${default(map.get(event,["taskExecution","exitCode"]),0)
                      == 50001}
                    assign:
                    - preempted: true
        - count_once:
            switch:
            - condition: ${preempted}
              assign:
              - evicted: ${evicted+1}
  - next_page:
      assign:
      - page: ${default(map.get(tasks.body,"nextPageToken"),"")}
  - more:
      switch:
      - condition: ${page != ""}
        next: read_tasks
  - choose:
      switch:
      - condition: ${evicted >= 4 and evicted*10 >= started and seconds > 180}
        assign:
        - seconds: 180
      - condition: ${evicted >= 2 and evicted*20 >= started and seconds > 300}
        assign:
        - seconds: 300
  - publish_change:
      switch:
      - condition: ${seconds < previous}
        steps:
        - publish:
            call: http.post
            args:
              url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
              auth:
                type: OAuth2
              query:
                uploadType: media
                name: ${"tree51/campaign01/control/"+string(seconds)+".json"}
                ifGenerationMatch: 0
              headers:
                Content-Type: application/json
              body:
                run_id: fds-tree51-campaign01
                checkpoint_seconds: ${seconds}
                confirmed_preemptions: ${evicted}
                started_tasks: ${started}
                job: ${c.job_id}
  - done:
      return: ${seconds}
initialize_checkpoint_control:
  steps:
  - publish_initial:
      call: http.post
      args:
        url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
        auth:
          type: OAuth2
        query:
          uploadType: media
          name: tree51/campaign01/control/480.json
          ifGenerationMatch: 0
        headers:
          Content-Type: application/json
        body:
          run_id: fds-tree51-campaign01
          checkpoint_seconds: 480
  - done:
      return: true
