stages:
  preflight:
    cmd: ../../.venv/bin/python preflight.py
    deps: [preflight.py, generate.py, design.json, inputs, ../../FDS/src/fds/Build/ompi_gnu_osx/fds_ompi_gnu_osx]
    outs:
      - data/preflight
      - results/local-preflight.json:
          cache: false
      - results/design-check.json:
          cache: false
  model_smoke:
    cmd: ../../.venv/bin/python models.py
    deps: [models.py, design.json]
    outs:
      - results/model-smoke.json:
          cache: false
  restore_cloud:
    cmd: ../../.venv/bin/python evidence.py extract
    deps: [evidence.py, data/cloud-evidence.tar.gz]
    outs: [data/cloud]
  development:
    cmd: ../../.venv/bin/python extract.py development
    deps: [extract.py, models.py, design.json, data/cloud, ../../FDS/install/bin/fds2ascii]
    outs: [data/development.json, data/boundary/development]
  train:
    cmd: ../../.venv/bin/python train.py
    deps: [train.py, models.py, training.json, design.json, data/development.json, data/cloud/calibration.json]
    outs:
      - data/models
      - results/frozen-predictions.json:
          cache: false
  test:
    cmd: ../../.venv/bin/python extract.py test
    deps: [extract.py, models.py, design.json, data/cloud, results/frozen-predictions.json, ../../FDS/install/bin/fds2ascii]
    outs: [data/test.json, data/boundary/test]
  evaluate:
    cmd: ../../.venv/bin/python evaluate.py
    deps: [evaluate.py, models.py, results/frozen-predictions.json, data/test.json]
    outs:
      - results/evaluation.json:
          cache: false
      - results/findings.md:
          cache: false
