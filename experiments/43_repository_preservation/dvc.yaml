stages:
  snapshot:
    cmd: ../../.venv/bin/python audit.py && ../../.venv/bin/python finalize.py
    deps:
    - audit.py
    - finalize.py
    outs:
    - data/public:
        persist: true
  private:
    cmd: ../../.venv/bin/python preserve_private.py
    deps:
    - preserve_private.py
    outs:
    - data/private:
        persist: true
