# Experiment 13: ladder tree present vs absent.
#
# `dvc repro` runs this file top to bottom; lock state lives in dvc.lock, which
# is committed.  Each case writes its solver output to its own subdirectory of
# the experiment's data/, because the boundary reader and the renderer both use
# fixed filenames that would collide if the two cases shared a directory.
#
# The .s3d volumes carry `cache: false`: they are outputs, so DVC knows what
# produces them and will re-solve when they are missing, but they are never
# copied into the cache or pushed.  They are most of the output by size and
# renders are not evidence.

stages:
  solve:
    wdir: ../..
    cmd: >-
      .venv/bin/python scripts/run_fds.py
      experiments/13_ladder_tree_pair/with_tree.fds:experiments/13_ladder_tree_pair/data/with_tree
      experiments/13_ladder_tree_pair/without_tree.fds:experiments/13_ladder_tree_pair/data/without_tree
      --jobs 2 --threads 4
      && .venv/bin/python scripts/strip_terrain.py experiments/13_ladder_tree_pair/data/with_tree with_tree
      && .venv/bin/python scripts/strip_terrain.py experiments/13_ladder_tree_pair/data/without_tree without_tree
    deps:
      - experiments/13_ladder_tree_pair/with_tree.fds
      - experiments/13_ladder_tree_pair/without_tree.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - experiments/13_ladder_tree_pair/data/with_tree/with_tree.smv
      - experiments/13_ladder_tree_pair/data/with_tree/with_tree_1.prt5
      - experiments/13_ladder_tree_pair/data/with_tree/with_tree_1_1.bf
      - experiments/13_ladder_tree_pair/data/with_tree/with_tree_1_2.bf
      - experiments/13_ladder_tree_pair/data/with_tree/with_tree_1_1.sf
      - experiments/13_ladder_tree_pair/data/with_tree/with_tree_1_2.sf
      - experiments/13_ladder_tree_pair/data/without_tree/without_tree.smv
      - experiments/13_ladder_tree_pair/data/without_tree/without_tree_1.prt5
      - experiments/13_ladder_tree_pair/data/without_tree/without_tree_1_1.bf
      - experiments/13_ladder_tree_pair/data/without_tree/without_tree_1_2.bf
      - experiments/13_ladder_tree_pair/data/without_tree/without_tree_1_1.sf
      - experiments/13_ladder_tree_pair/data/without_tree/without_tree_1_2.sf
      - experiments/13_ladder_tree_pair/data/with_tree/with_tree_1_1.s3d:
          cache: false
      - experiments/13_ladder_tree_pair/data/with_tree/with_tree_1_3.s3d:
          cache: false
      - experiments/13_ladder_tree_pair/data/without_tree/without_tree_1_1.s3d:
          cache: false
      - experiments/13_ladder_tree_pair/data/without_tree/without_tree_1_3.s3d:
          cache: false

  boundary:
    foreach:
      - with_tree
      - without_tree
    do:
      wdir: ../..
      cmd: >-
        .venv/bin/python scripts/surface_temp.py
        experiments/13_ladder_tree_pair/${item}.json
      deps:
        - experiments/13_ladder_tree_pair/${item}.json
        - experiments/13_ladder_tree_pair/data/${item}/${item}_1_1.bf
        - experiments/13_ladder_tree_pair/data/${item}/${item}_1_2.bf
        - scripts/surface_temp.py
        - scripts/case_config.py
      outs:
        - experiments/13_ladder_tree_pair/data/${item}/ign_state.json

  render:
    foreach:
      - with_tree
      - without_tree
    do:
      wdir: ../..
      cmd: >-
        .venv/bin/python scripts/render_animation.py
        experiments/13_ladder_tree_pair/${item}.json
      deps:
        - experiments/13_ladder_tree_pair/${item}.json
        - experiments/13_ladder_tree_pair/view.ini
        - experiments/13_ladder_tree_pair/data/${item}/ign_state.json
        - experiments/13_ladder_tree_pair/data/${item}/${item}.smv
        - experiments/13_ladder_tree_pair/data/${item}/${item}_1_1.s3d
        - experiments/13_ladder_tree_pair/data/${item}/${item}_1_3.s3d
        - experiments/13_ladder_tree_pair/data/${item}/${item}_1.prt5
        - scripts/render_animation.py
        - scripts/case_config.py
      outs:
        # The gif and the stills stay in git so they render on GitHub, so they
        # are uncached: DVC records that this stage produces them, and what
        # they were made from, without taking ownership of the bytes.
        - experiments/13_ladder_tree_pair/results/${item}:
            cache: false

  stitch:
    wdir: ../..
    cmd: >-
      .venv/bin/python scripts/stitch_gifs.py
      experiments/13_ladder_tree_pair/results/side_by_side.gif
      experiments/13_ladder_tree_pair/results/with_tree/ignition_data.gif
      experiments/13_ladder_tree_pair/results/without_tree/ignition_data.gif
    deps:
      - experiments/13_ladder_tree_pair/results/with_tree/ignition_data.gif
      - experiments/13_ladder_tree_pair/results/without_tree/ignition_data.gif
      - scripts/stitch_gifs.py
      - scripts/gif_frame.py
    outs:
      - experiments/13_ladder_tree_pair/results/side_by_side.gif:
          cache: false

  validate:
    foreach:
      - with_tree
      - without_tree
    do:
      wdir: ../..
      cmd: >-
        .venv/bin/python scripts/validate_animation.py
        experiments/13_ladder_tree_pair/${item}.json
      deps:
        - experiments/13_ladder_tree_pair/${item}.json
        - experiments/13_ladder_tree_pair/results/${item}
        - experiments/13_ladder_tree_pair/data/${item}/ign_state.json
        - scripts/validate_animation.py
