main:
  steps:
  - init:
      assign:
      - candidates:
        - id: or
          region: us-west1
          zones:
          - us-west1-a
          - us-west1-b
          label: gpu39-pool02-or
          job_id: fds-gpu39-pool02-or
          job:
            taskGroups:
            - taskCount: '1'
              parallelism: '1'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 12000
                maxRunDuration: 49500s
                maxRetryCount: 0
                runnables:
                - container:
                    imageUri: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
                    entrypoint: python
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --shm-size=1g
                environment:
                  variables:
                    TRAINING_SOFT_SECONDS: '48600'
                    OUTPUT_PREFIX: longwindow39/pool02/or/
                    CANDIDATE_ID: or
            allocationPolicy:
              instances:
              - policy:
                  machineType: n1-standard-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '60'
                    type: pd-balanced
                  accelerators:
                  - type: nvidia-tesla-t4
                    count: 1
                installGpuDrivers: true
              location:
                allowedLocations:
                - zones/us-west1-a
                - zones/us-west1-b
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: gpu39-pool02-or
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/fds-trial
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-west1/subnetworks/fds-timing-west1
            labels:
              trial_id: gpu39-pool02-or
            logsPolicy:
              destination: CLOUD_LOGGING
        - id: ia
          region: us-central1
          zones:
          - us-central1-a
          - us-central1-b
          - us-central1-c
          - us-central1-f
          label: gpu39-pool02-ia
          job_id: fds-gpu39-pool02-ia
          job:
            taskGroups:
            - taskCount: '1'
              parallelism: '1'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 12000
                maxRunDuration: 49500s
                maxRetryCount: 0
                runnables:
                - container:
                    imageUri: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
                    entrypoint: python
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --shm-size=1g
                environment:
                  variables:
                    TRAINING_SOFT_SECONDS: '48600'
                    OUTPUT_PREFIX: longwindow39/pool02/ia/
                    CANDIDATE_ID: ia
            allocationPolicy:
              instances:
              - policy:
                  machineType: n1-standard-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '60'
                    type: pd-balanced
                  accelerators:
                  - type: nvidia-tesla-t4
                    count: 1
                installGpuDrivers: true
              location:
                allowedLocations:
                - zones/us-central1-a
                - zones/us-central1-b
                - zones/us-central1-c
                - zones/us-central1-f
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: gpu39-pool02-ia
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/fds-trial
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-central1/subnetworks/fds-trial
            labels:
              trial_id: gpu39-pool02-ia
            logsPolicy:
              destination: CLOUD_LOGGING
        - id: sc
          region: us-east1
          zones:
          - us-east1-b
          - us-east1-c
          - us-east1-d
          label: gpu39-pool02-sc
          job_id: fds-gpu39-pool02-sc
          job:
            taskGroups:
            - taskCount: '1'
              parallelism: '1'
              taskCountPerNode: '1'
              taskSpec:
                computeResource:
                  cpuMilli: 4000
                  memoryMib: 12000
                maxRunDuration: 49500s
                maxRetryCount: 0
                runnables:
                - container:
                    imageUri: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
                    entrypoint: python
                    commands:
                    - -c
                    - import base64;exec(compile(base64.b64decode(''),'bootstrap','exec'))
                    options: --shm-size=1g
                environment:
                  variables:
                    TRAINING_SOFT_SECONDS: '48600'
                    OUTPUT_PREFIX: longwindow39/pool02/sc/
                    CANDIDATE_ID: sc
            allocationPolicy:
              instances:
              - policy:
                  machineType: n1-standard-4
                  provisioningModel: SPOT
                  bootDisk:
                    sizeGb: '60'
                    type: pd-balanced
                  accelerators:
                  - type: nvidia-tesla-t4
                    count: 1
                installGpuDrivers: true
              location:
                allowedLocations:
                - zones/us-east1-b
                - zones/us-east1-c
                - zones/us-east1-d
              serviceAccount:
                email: fds-worker@tmrw-wildfire-20261015.iam.gserviceaccount.com
              labels:
                trial_id: gpu39-pool02-sc
              network:
                networkInterfaces:
                - network: projects/tmrw-wildfire-20261015/global/networks/default
                  subnetwork: projects/tmrw-wildfire-20261015/regions/us-east1/subnetworks/default
            labels:
              trial_id: gpu39-pool02-sc
            logsPolicy:
              destination: CLOUD_LOGGING
  - write_probe1:
      call: http.post
      args:
        url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
        auth:
          type: OAuth2
        query:
          uploadType: media
          name: ${"longwindow39/pool02/preflight-status" + "." + string(sys.now())}
        headers:
          Content-Type: application/json
        body:
          passed: true
  - write_probe2:
      call: http.post
      args:
        url: https://storage.googleapis.com/upload/storage/v1/b/tmrw-wildfire-20261015-trial/o
        auth:
          type: OAuth2
        query:
          uploadType: media
          name: ${"longwindow39/pool02/preflight-status" + "." + string(sys.now())}
        headers:
          Content-Type: application/json
        body:
          passed: true
  - all:
      for:
        value: c
        in: ${candidates}
        steps:
        - inspect:
            call: inventory
            args:
              c: ${c}
            result: inv
        - empty:
            switch:
            - condition: ${len(inv.vms)>0 or len(inv.disks)>0}
              raise: Existing pool resources; reconcile before submission
  - done:
      return:
        passed: true
inventory:
  params:
  - c
  steps:
  - init:
      assign:
      - vms: []
      - disks: []
  - zones:
      for:
        value: z
        in: ${c.zones}
        steps:
        - get_vms:
            call: http.get
            args:
              url: ${"https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/"
                + z + "/instances"}
              auth:
                type: OAuth2
              query:
                filter: ${"labels.trial_id = " + c.label}
            result: v
        - append_vms:
            for:
              value: vm
              in: ${default(map.get(v.body,"items"),[])}
              steps:
              - add_vm:
                  assign:
                  - vms: ${list.concat(vms,vm)}
        - get_disks:
            call: http.get
            args:
              url: ${"https://compute.googleapis.com/compute/v1/projects/tmrw-wildfire-20261015/zones/"
                + z + "/disks"}
              auth:
                type: OAuth2
              query:
                filter: ${"labels.trial_id = " + c.label}
            result: d
        - append_disks:
            for:
              value: disk
              in: ${default(map.get(d.body,"items"),[])}
              steps:
              - add_disk:
                  assign:
                  - disks: ${list.concat(disks,disk)}
  - done:
      return:
        vms: ${vms}
        disks: ${disks}
