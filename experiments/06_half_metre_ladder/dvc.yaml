# Experiment 06: half-metre cells, a tree ignites and takes over.
#
# `dvc repro` runs this file; `dvc.lock` is committed.  Outputs are tracked
# where FDS writes them; the .s3d volumes are uncached, so DVC knows this stage
# produces them without ever copying or pushing them.
stages:
  solve:
    wdir: ../..
    cmd: >-
      python3 scripts/run_fds.py experiments/06_half_metre_ladder/wick2.fds --threads 4
      && python3 scripts/strip_terrain.py FDS/cases/wick2 wick2
    deps:
      - experiments/06_half_metre_ladder/wick2.fds
      - scripts/run_fds.py
      - scripts/strip_terrain.py
    outs:
      - FDS/cases/wick2/wick2_1.prt5
      - FDS/cases/wick2/wick2_1_1.bf
      - FDS/cases/wick2/wick2_1_2.bf
      - FDS/cases/wick2/wick2_1_1.sf
      - FDS/cases/wick2/wick2_1_2.sf
      - FDS/cases/wick2/wick2.smv
      - FDS/cases/wick2/wick2_1_1.s3d:
          cache: false
      - FDS/cases/wick2/wick2_1_2.s3d:
          cache: false
      - FDS/cases/wick2/wick2_1_3.s3d:
          cache: false
